<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <title>VELOUR Branch Isolation QA</title>
  <style>
    :root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
    body{margin:0;min-height:100vh;background:#13070d;color:#f7ebef;display:grid;place-items:center;padding:24px;box-sizing:border-box}
    main{width:min(680px,100%);background:#211019;border:1px solid #5d3448;border-radius:18px;padding:22px;box-sizing:border-box;box-shadow:0 20px 60px rgba(0,0,0,.35)}
    h1{font-size:20px;margin:0 0 10px}.sub{font-size:13px;color:#c9adb9;line-height:1.55;margin-bottom:18px}
    #status{font-size:22px;font-weight:900;margin:10px 0 16px}.running{color:#ffd98f}.pass{color:#9ff0b5}.fail{color:#ff9da9}
    #steps{display:grid;gap:8px;font-size:13px;line-height:1.5}.row{padding:10px 12px;border-radius:10px;background:#180b11;border:1px solid #3c2230}.ok{border-color:#2f6a42}.bad{border-color:#7c3340}
    #detail{white-space:pre-wrap;word-break:break-word;margin-top:14px;padding:12px;border-radius:10px;background:#0e080b;color:#d8c3cc;font:12px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;display:none}
    iframe{position:fixed;width:1px;height:1px;opacity:0;pointer-events:none;border:0;left:-9999px;top:-9999px}
  </style>
</head>
<body>
<main>
  <h1>VELOUR · SPECIFIC EPISODE BRANCH QA</h1>
  <div class="sub">선택한 작품의 화별 본문 + 같은 작품 백업만 사용하고, 다른 작품/현재 열린 작품의 내용이 섞이지 않는지 자동 검증해. Gemini 생성 함수는 호출하지 않아.</div>
  <div id="status" class="running">검증 중…</div>
  <div id="steps"></div>
  <pre id="detail"></pre>
</main>
<iframe id="app" src="/?qaBranchHarnessFrame=1" aria-hidden="true"></iframe>
<script>
(() => {
  'use strict';
  const status = document.getElementById('status');
  const steps = document.getElementById('steps');
  const detail = document.getElementById('detail');
  const frame = document.getElementById('app');
  const P = '__velour_qa_branch__';
  const A = P + 'A';
  const B = P + 'B';
  const C = P + 'C_missing';
  const D = P + 'D_foreign';
  const results = [];
  const row = (ok, text) => { results.push({ok,text}); const el=document.createElement('div'); el.className='row '+(ok?'ok':'bad'); el.textContent=(ok?'✓ ':'✗ ')+text; steps.appendChild(el); };
  const wait = ms => new Promise(r=>setTimeout(r,ms));
  const text = (id, ep) => `[${id} EP${ep}] ${id} 전용 본문`;
  const story = (id,title,episodeCount,eps) => ({
    id,title,date:'QA',createdAt:new Date().toISOString(),updatedAt:new Date().toISOString(),episodeCount,
    episodes:eps.map(n=>({episode:n,text:text(id,n)})),
    storyHistory:eps.map(n=>text(id,n)).join('\n\n'),
    currentText:text(id,episodeCount), settings:{chars:title,plot:'QA'},
    activeStoryId:id,activeStoryTitle:title,
    v4State:{runtime:{confirmedEpisode:episodeCount,timeline:eps.map(n=>`EP${n}: ${id}`),scenes:[],openThreads:[],durableFacts:[],arcSummaries:[],arcBuffer:[],relationshipState:id,causalCarry:id,positionUsage:{},lastSuggestedPositions:[],playUsage:{},lastSuggestedPlays:[],beatTracker:{index:0,beatKey:'',phase:'setup',episodes:0,lastProgress:0,evidence:[]}}}
  });

  async function run(){
    const w = frame.contentWindow;
    for(let i=0;i<160;i++){
      if(w?.__VELOUR_STORAGE_QA__?.idbPut && w?.__VELOUR_STORAGE_QA__?.idbGetAll && typeof w.branchStoryFromEpisode==='function') break;
      await wait(100);
    }
    const qa = w?.__VELOUR_STORAGE_QA__;
    if(!qa?.idbPut || !qa?.idbGetAll || typeof w.branchStoryFromEpisode!=='function') throw new Error('storage/branch QA bridge not ready');
    await w.__VELOUR_STORAGE_READY__;

    const oldDraft = await qa.idbGet('drafts','current').catch(()=>null);
    const oldConfirm = w.confirm, oldAlert = w.alert, oldPrompt = w.prompt;
    let generateCalls = 0;
    const oldGenerate = w.generateStory;
    if(typeof oldGenerate==='function') w.generateStory = async function(){ generateCalls++; return oldGenerate.apply(this,arguments); };
    w.confirm = () => true;
    w.prompt = () => '3';
    const alerts = [];
    w.alert = msg => alerts.push(String(msg||''));

    const cleanup = async () => {
      try{
        const all = await qa.idbGetAll('stories');
        for(const s of all||[]) if(String(s?.id||'').startsWith(P) || String(s?.branchOf||'').startsWith(P)) await qa.idbDelete('stories',String(s.id));
        const backs = await qa.idbGetAll('storyBackups');
        for(const b of backs||[]) if(String(b?.backupId||'').startsWith(P) || String(b?.storyId||'').startsWith(P)) await qa.idbDelete('storyBackups',String(b.backupId));
        if(oldDraft) await qa.idbPut('drafts',oldDraft); else await qa.idbDelete('drafts','current');
      }catch(_){}
      w.confirm=oldConfirm; w.alert=oldAlert; w.prompt=oldPrompt; if(oldGenerate) w.generateStory=oldGenerate;
    };

    try{
      // Scenario 1: selected story A is open while draft/current state belongs to foreign story B.
      const a = story(A,'[QA] Selected A',4,[1,3,4]);
      a.currentText=text(A,4);
      a.storyHistory=[text(A,1),text(A,3),text(A,4)].join('\n\n');
      const aExact = story(A,'[QA] Selected A',2,[1,2]);
      const b = story(B,'[QA] Foreign B',4,[1,2,3,4]);
      await qa.idbPut('stories',a);
      await qa.idbPut('stories',b);
      await qa.idbPut('storyBackups',{backupId:P+'backup_A_ep2',storyId:A,savedAt:new Date().toISOString(),source:'qa',story:aExact});
      await qa.idbPut('storyBackups',{backupId:P+'backup_B_ep2',storyId:B,savedAt:new Date().toISOString(),source:'qa',story:story(B,'[QA] Foreign B',2,[1,2])});
      await qa.idbPut('drafts',{id:'current',savedAt:new Date().toISOString(),episodeCount:4,episodes:b.episodes,storyHistory:b.storyHistory,currentText:b.currentText,settings:b.settings,activeStoryId:B,activeStoryTitle:b.title,v4State:b.v4State});

      const beforeA = JSON.stringify(await qa.idbGet('stories',A));
      const beforeB = JSON.stringify(await qa.idbGet('stories',B));
      await w.branchStoryFromEpisode(A,3);
      const all1 = await qa.idbGetAll('stories');
      const branchesA = (all1||[]).filter(s=>String(s?.branchOf||'')===A && Number(s?.branchRestartEpisode||0)===3);
      const br = branchesA[0];
      const brText = br ? JSON.stringify({episodes:br.episodes,storyHistory:br.storyHistory,currentText:br.currentText,v4State:br.v4State}) : '';
      const only12 = !!br && JSON.stringify((br.episodes||[]).map(x=>Number(x.episode)))==='[1,2]';
      const hasA12 = !!br && brText.includes(A+' EP1') && brText.includes(A+' EP2');
      const noFutureA = !!br && !brText.includes(A+' EP3') && !brText.includes(A+' EP4');
      const noForeign = !!br && !brText.includes(B) && !brText.includes(D);
      const draft1 = await qa.idbGet('drafts','current');
      const draftClean = !!br && String(draft1?.activeStoryId||'')===String(br.id) && !JSON.stringify(draft1||{}).includes(B);
      const originalsIntact = JSON.stringify(await qa.idbGet('stories',A))===beforeA && JSON.stringify(await qa.idbGet('stories',B))===beforeB;

      row(branchesA.length===1,'선택한 작품 A에서 새 분기 1개만 생성');
      row(only12,'EP3부터 재작성 시 새 분기는 EP1~2만 보유');
      row(hasA12,'누락 EP2는 같은 작품 A의 백업에서만 복구');
      row(noFutureA,'원본의 미래 EP3~4가 새 분기에 유입되지 않음');
      row(noForeign,'현재 열려 있던 다른 작품 B 내용이 전혀 섞이지 않음');
      row(draftClean,'현재 draft도 새 분기 ID + A 계열 내용으로만 연결');
      row(originalsIntact,'원본 A와 외부 작품 B는 덮어쓰지 않음');

      // Scenario 2: selected C is missing EP2. Foreign D has EP2, but it must NOT be borrowed.
      const c = story(C,'[QA] Missing Target C',3,[1,3]);
      c.storyHistory=[text(C,1),text(C,3)].join('\n\n'); c.currentText=text(C,3);
      const d = story(D,'[QA] Foreign Target D',3,[1,2,3]);
      await qa.idbPut('stories',c); await qa.idbPut('stories',d);
      const beforeCount = (await qa.idbGetAll('stories')).filter(s=>String(s?.branchOf||'')===C).length;
      await w.branchStoryFromEpisode(C,3);
      const all2 = await qa.idbGetAll('stories');
      const afterC = all2.filter(s=>String(s?.branchOf||'')===C);
      const missingAbort = afterC.length===beforeCount;
      const warnedMissing = alerts.some(x=>x.includes('EP2') && (x.includes('찾지 못') || x.includes('안전')));
      row(missingAbort,'선택 작품 C에 EP2가 없으면 다른 작품 D의 EP2를 빌리지 않고 중단');
      row(warnedMissing,'누락 화를 조용히 짬뽕하지 않고 안전 중단 메시지 표시');
      row(generateCalls===0,`Gemini 생성 호출 · ${generateCalls}회`);

      const pass = results.every(x=>x.ok);
      status.textContent = pass ? 'PASS ✅' : 'FAIL ❌';
      status.className = pass ? 'pass' : 'fail';
      if(!pass){ detail.style.display='block'; detail.textContent=JSON.stringify({alerts,branchesA:branchesA.map(x=>({id:x.id,episodes:x.episodes,history:x.storyHistory})),draft1,generateCalls},null,2); }
    } finally { await cleanup(); }
  }

  frame.addEventListener('load',()=>run().catch(async e=>{
    status.textContent='FAIL ❌'; status.className='fail';
    row(false,'자동 검증 실행 오류'); detail.style.display='block'; detail.textContent=String(e?.stack||e);
  }),{once:true});
})();
</script>
</body>
</html>
