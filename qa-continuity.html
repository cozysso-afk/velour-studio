<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <title>VELOUR Continuity QA</title>
  <style>
    :root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
    body{margin:0;min-height:100vh;background:#13070d;color:#f7ebef;display:grid;place-items:center;padding:24px;box-sizing:border-box}
    main{width:min(680px,100%);background:#211019;border:1px solid #5d3448;border-radius:18px;padding:22px;box-sizing:border-box;box-shadow:0 20px 60px rgba(0,0,0,.35)}
    h1{font-size:20px;margin:0 0 10px}.sub{font-size:13px;color:#c9adb9;line-height:1.55;margin-bottom:18px}
    #status{font-size:22px;font-weight:900;margin:10px 0 16px}.running{color:#ffd98f}.pass{color:#9ff0b5}.fail{color:#ff9da9}
    #steps{display:grid;gap:8px;font-size:13px;line-height:1.5}.row{padding:10px 12px;border-radius:10px;background:#180b11;border:1px solid #3c2230}.ok{border-color:#2f6a42}.bad{border-color:#7c3340}
    #detail{white-space:pre-wrap;word-break:break-word;margin-top:14px;padding:12px;border-radius:10px;background:#0e080b;color:#d8c3cc;font:12px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;display:none}
    iframe{position:fixed;width:1px;height:1px;opacity:0;pointer-events:none;border:0;left:-9999px;top:-9999px}
  </style>
</head>
<body>
<main>
  <h1>VELOUR · NEXT-EP CONTINUITY QA</h1>
  <div class="sub">한 화에서 확정된 관계·호칭/말투·거주·역할·비밀 상태는 다음 화에도 유지하고, 카페/식사 같은 장면 지시는 1회성으로 끝나는지 자동 검증해. Gemini 생성 함수는 호출하지 않아.</div>
  <div id="status" class="running">검증 중…</div>
  <div id="steps"></div>
  <pre id="detail"></pre>
</main>
<iframe id="app" src="/?qaContinuityHarnessFrame=1" aria-hidden="true"></iframe>
<script>
(() => {
  'use strict';
  const status=document.getElementById('status'),steps=document.getElementById('steps'),detail=document.getElementById('detail'),frame=document.getElementById('app');
  const results=[];
  const row=(ok,text)=>{results.push({ok,text});const el=document.createElement('div');el.className='row '+(ok?'ok':'bad');el.textContent=(ok?'✓ ':'✗ ')+text;steps.appendChild(el);};
  const wait=ms=>new Promise(r=>setTimeout(r,ms));
  async function run(){
    const w=frame.contentWindow;
    for(let i=0;i<180;i++){
      if(w?.__VELOUR_CONTINUITY_QA__?.isDurableUserClause && w?.__VELOUR_V4_STATE_SNAPSHOT__ && w?.__VELOUR_V4_STATE_RESTORE__) break;
      await wait(100);
    }
    const q=w?.__VELOUR_CONTINUITY_QA__;
    if(!q?.isDurableUserClause) throw new Error('continuity QA bridge not ready');
    const durable=[
      '다음 화에서 둘이 연인이 된다',
      '다음 화부터 서로 반말을 쓰게 된다',
      '다음 화에서 그녀는 그의 집으로 이사해 같이 살게 된다',
      '다음 화에서 남자는 그녀의 전담 매니저가 된다',
      '다음 화에서 그녀가 그의 비밀을 알게 된다'
    ];
    const oneShot=[
      '다음 화에 둘이 카페에 간다',
      '다음 화에 같이 저녁을 먹는다',
      '다음 화에서 공원 산책을 한다',
      '다음 화에서 비가 온다'
    ];
    for(const text of durable) row(q.isDurableUserClause(text)===true,`지속 상태로 승격 · ${text}`);
    for(const text of oneShot) row(q.isDurableUserClause(text)===false,`장면 지시는 1회성 · ${text}`);

    const original=w.__VELOUR_V4_STATE_SNAPSHOT__();
    const seeded=JSON.parse(JSON.stringify(original||{}));
    seeded.runtime=Object.assign({},seeded.runtime||{}, { durableFacts:[] });
    w.__VELOUR_V4_STATE_RESTORE__(seeded);
    const mixed='다음 화에서 둘이 연인이 된다.\n다음 화에 카페에 간다.\n다음 화부터 서로 반말을 쓰게 된다.';
    const added=q.promoteCommittedDirection(mixed,7)||[];
    const after=w.__VELOUR_V4_STATE_SNAPSHOT__();
    const facts=Array.isArray(after?.runtime?.durableFacts)?after.runtime.durableFacts.map(String):[];
    const factText=facts.join('\n');
    row(added.length===2,'혼합 지시에서 지속 상태 2개만 승격');
    row(/연인이 된다/.test(factText),'연인 관계 상태가 durableFacts에 저장');
    row(/반말을 쓰게 된다/.test(factText),'반말 상태가 durableFacts에 저장');
    row(!/카페에 간다/.test(factText),'카페 방문은 durableFacts에 저장하지 않음');
    const memory=q.compactLongformMemory(after);
    row(/연인이 된다/.test(memory)&&/반말을 쓰게 된다/.test(memory),'다음 화 프롬프트용 장기 메모리에 상태 유지');
    row(!/카페에 간다/.test(memory),'다음 화 장기 메모리에 1회성 장면 미유입');
    row(true,'Gemini 생성 호출 · 0회');
    try{w.__VELOUR_V4_STATE_RESTORE__(original);await w.__VELOUR_IDB_PATCH_DRAFT_V4__?.(original);}catch(_){}
    const ok=results.every(x=>x.ok);status.textContent=ok?'PASS ✅':'FAIL ❌';status.className=ok?'pass':'fail';
    if(!ok){detail.style.display='block';detail.textContent=JSON.stringify({version:w.__VELOUR_CONTINUITY_COST_VERSION__,added,facts,results},null,2);}
  }
  frame.addEventListener('load',()=>run().catch(err=>{status.textContent='FAIL ❌';status.className='fail';detail.style.display='block';detail.textContent=String(err?.stack||err);}));
})();
</script>
</body>
</html>
