name: ui-hierarchy-v2-check

on:
  push:
    branches:
      - feat/ui-hierarchy-cleanup-v1

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ui-hierarchy-cleanup-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Wire UI hierarchy and cache
        run: |
          python - <<'PY'
          from pathlib import Path

          for name in ['index.html','scripts/build-github-pages-canonical.mjs']:
              p=Path(name)
              s=p.read_text()
              s=s.replace('velour-v4.4.38-vault-accept-hotfix.js?v=29','velour-v4.4.38-vault-accept-hotfix.js?v=30')
              marker='<script src="./velour-v4.4.38-vault-accept-hotfix.js?v=30"></script>'
              addition=marker+'\n<script src="./velour-v4.4.38-ui-hierarchy-v2.js?v=1"></script>'
              if 'velour-v4.4.38-ui-hierarchy-v2.js?v=1' not in s:
                  if marker not in s:
                      raise SystemExit(f'{name}: vault loader marker not found')
                  s=s.replace(marker,addition,1)
              p.write_text(s)

          for name in [
              'scripts/test-core-character-textarea.mjs',
              'scripts/test-authoring-experience-v1.mjs',
              'scripts/test-character-card-interaction-fix.mjs'
          ]:
              p=Path(name)
              s=p.read_text().replace('v=29','v=30')
              p.write_text(s)
          PY

      - name: Add focused UI hierarchy regression
        run: |
          cat > scripts/test-ui-hierarchy-v2.mjs <<'EOF'
          #!/usr/bin/env node
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';

          const ui=readFileSync('velour-v4.4.38-ui-hierarchy-v2.js','utf8');
          const index=readFileSync('index.html','utf8');
          const canonical=readFileSync('scripts/build-github-pages-canonical.mjs','utf8');

          assert.match(ui,/const VERSION='1\.0\.0'/);
          assert.match(ui,/velourCharacterProfileHub/);
          assert.match(ui,/인물 설정 · 성격\/말투\/적극성/);
          assert.match(ui,/velourIntimacyPreferenceHub/);
          assert.match(ui,/친밀 취향 · 캐릭터별 선호/);
          assert.match(ui,/document\.getElementById\('velourSceneGovernorV1'\)/);
          assert.match(ui,/document\.getElementById\('velourEnsemblePrefsV1'\)/);
          assert.match(ui,/document\.getElementById\('velourIntimacyDepthV1'\)/);
          assert.match(ui,/velour-v2-pref-source/);
          assert.match(ui,/original\.click\(\)/,'preference proxies must reuse original state listeners');
          assert.match(ui,/document\.getElementById\('v41SecLanguage'\)/);
          assert.match(ui,/velourVerbalChemistryPanel/);
          assert.match(ui,/grid-template-columns:repeat\(2,minmax\(0,1fr\)\)/);
          assert.match(ui,/#velourIntimacyDepthV1\{display:none!important\}/);
          assert.doesNotMatch(ui,/window\.buildPrompt\s*=/,'UI hierarchy layer must not wrap prompt generation');
          assert.doesNotMatch(ui,/buildPrompt=function/,'UI hierarchy layer must remain presentation-only');

          assert.match(index,/velour-v4\.4\.38-vault-accept-hotfix\.js\?v=30/);
          assert.match(canonical,/velour-v4\.4\.38-vault-accept-hotfix\.js\?v=30/);
          assert.match(index,/velour-v4\.4\.38-ui-hierarchy-v2\.js\?v=1/);
          assert.match(canonical,/velour-v4\.4\.38-ui-hierarchy-v2\.js\?v=1/);
          console.log('PASS: UI hierarchy separates character, intimacy, and writing-style controls without changing prompt/state logic');
          EOF

      - name: Run regression suite
        run: |
          node --check velour-v4.4.38-ui-hierarchy-v2.js
          node scripts/test-ui-hierarchy-v2.mjs
          node scripts/test-core-character-textarea.mjs
          node scripts/test-authoring-experience-v1.mjs
          node scripts/test-character-card-interaction-fix.mjs
          node scripts/test-ensemble-character-preferences.mjs
          node scripts/test-intimacy-preference-depth.mjs
          node scripts/test-live-canon-scene-governor.mjs
          node scripts/test-concept-relationship-governor.mjs
          node scripts/test-verbal-chemistry-v2.mjs
          node scripts/test-verbal-chemistry-refinement.mjs

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html scripts/build-github-pages-canonical.mjs scripts/test-core-character-textarea.mjs scripts/test-authoring-experience-v1.mjs scripts/test-character-card-interaction-fix.mjs scripts/test-ui-hierarchy-v2.mjs
          git commit -m "Polish authoring UI hierarchy"
          git push origin HEAD:feat/ui-hierarchy-cleanup-v1
