name: canon-scene-variety-check

on:
  push:
    branches:
      - fix/canon-scene-variety-v1

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/canon-scene-variety-v1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax checks
        run: |
          node --check velour-v4.4.38-verbal-chemistry-refinement.js
          node --check velour-v4.4.38-live-canon-scene-governor.js
          node --check velour-v4.4.38-vault-accept-hotfix.js
      - name: Language firewall regression
        run: node scripts/test-verbal-chemistry-refinement.mjs
      - name: Live canon and scene governor regression
        run: node scripts/test-live-canon-scene-governor.mjs
      - name: Bust production parent-loader cache
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in ['index.html','scripts/build-github-pages-canonical.mjs']:
              p=Path(name)
              s=p.read_text()
              s=s.replace('velour-v4.4.38-vault-accept-hotfix.js?v=22','velour-v4.4.38-vault-accept-hotfix.js?v=23')
              p.write_text(s)
          PY
      - name: Commit cache bump if needed
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html scripts/build-github-pages-canonical.mjs
          git commit -m "Bust live canon scene governor loader cache"
          git push origin HEAD:fix/canon-scene-variety-v1
