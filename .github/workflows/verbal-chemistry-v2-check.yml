name: verbal-chemistry-v2-check

on:
  push:
    branches:
      - feat/verbal-chemistry-v2

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: node --check velour-v4.4.38-verbal-chemistry-v2.js
      - name: Regression test
        run: node scripts/test-verbal-chemistry-v2.mjs
