name: character-card-fix-check

on:
  push:
    branches:
      - fix/character-multiselect-stays-open

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/character-multiselect-stays-open
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Patch character card interaction and source mapping
        run: |
          python - <<'PY'
          from pathlib import Path

          # 1) Keep multi-select cards open: update tag styles in place instead of full re-render.
          p=Path('velour-v4.4.38-ensemble-character-preferences.js')
          s=p.read_text()
          s=s.replace("const VERSION='1.0.1';", "const VERSION='1.0.2';")
          old="if(target?.dataset?.tagId){const key=target.dataset.tagKind==='personality'?'personalities':'tendencies',id=target.dataset.tagId;character[key]=character[key].includes(id)?character[key].filter(x=>x!==id):[...character[key],id].slice(-5);saveCfg(next);wrap.remove();renderUI();scheduleDraftPatch();return;}"
          new="if(target?.dataset?.tagId){const key=target.dataset.tagKind==='personality'?'personalities':'tendencies',id=target.dataset.tagId,wasSelected=character[key].includes(id);character[key]=wasSelected?character[key].filter(x=>x!==id):[...character[key],id].slice(-5);saveCfg(next);const kindName=target.dataset.tagKind;card.querySelectorAll?.(`[data-tag-kind=\"${kindName}\"][data-tag-id]`).forEach(btn=>{const on=character[key].includes(btn.dataset.tagId);btn.style.borderColor=on?'rgba(245,196,107,.60)':'rgba(245,196,107,.20)';btn.style.background=on?'rgba(245,196,107,.16)':'rgba(255,255,255,.03)';btn.style.color=on?'#ffebaa':'#cdbbc4';btn.setAttribute?.('aria-pressed',on?'true':'false');});scheduleDraftPatch();return;}"
          if old not in s:
              raise SystemExit('ensemble tag rerender block not found')
          s=s.replace(old,new)
          p.write_text(s)

          # 2) V4 occupation convention in the current UI is A=male lead, B=heroine.
          #    The authoring layer had those reversed when mirroring them into character cards.
          p=Path('velour-v4.4.38-authoring-experience-v1.js')
          s=p.read_text()
          s=s.replace("const VERSION = '1.0.0';", "const VERSION = '1.0.1';")
          old="assign(cfg.heroine,'role',occA);\n    assign(cfg.partners[0],'role',occB);"
          new="assign(cfg.heroine,'role',occB);\n    assign(cfg.partners[0],'role',occA);"
          if old not in s:
              raise SystemExit('authoring role mirror block not found')
          s=s.replace(old,new)
          old="const role = kind === 'heroine' ? selectedText('v4OccA') : selectedText('v4OccB');"
          new="const role = kind === 'heroine' ? selectedText('v4OccB') : selectedText('v4OccA');"
          if old not in s:
              raise SystemExit('authoring source summary mapping not found')
          s=s.replace(old,new)
          old="return `직업 ${role || '기존 V4 설정'} · 현재 관계 ${rel || '기존 V4 설정'} — 여기서 다시 입력하지 않아도 돼.`;"
          new="const agencyNote = kind === 'heroine' ? '여주 적극성은 위 SCENE AGENCY에서 설정' : '이 상대의 적극성은 이 카드에서 개별 설정';\n    return `직업 ${role || '기존 V4 설정'} · 현재 관계 ${rel || '기존 V4 설정'} · ${agencyNote} — 직업/관계는 여기서 다시 입력하지 않아도 돼.`;"
          if old not in s:
              raise SystemExit('authoring source summary text not found')
          s=s.replace(old,new)
          p.write_text(s)

          # 3) Bust both inner-module caches and the outer loader cache.
          p=Path('velour-v4.4.38-vault-accept-hotfix.js')
          s=p.read_text()
          s=s.replace("velour-v4.4.38-ensemble-character-preferences.js?v=1", "velour-v4.4.38-ensemble-character-preferences.js?v=2")
          s=s.replace("velour-v4.4.38-authoring-experience-v1.js?v=1", "velour-v4.4.38-authoring-experience-v1.js?v=2")
          p.write_text(s)

          for name in ['index.html','scripts/build-github-pages-canonical.mjs']:
              p=Path(name); s=p.read_text()
              if 'velour-v4.4.38-vault-accept-hotfix.js?v=27' not in s:
                  raise SystemExit(f'{name}: expected outer cache v27 not found')
              p.write_text(s.replace('velour-v4.4.38-vault-accept-hotfix.js?v=27','velour-v4.4.38-vault-accept-hotfix.js?v=28'))
          PY

      - name: Add focused regression checks
        run: |
          cat > scripts/test-character-card-interaction-fix.mjs <<'EOF'
          #!/usr/bin/env node
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const ensemble=readFileSync('velour-v4.4.38-ensemble-character-preferences.js','utf8');
          const authoring=readFileSync('velour-v4.4.38-authoring-experience-v1.js','utf8');
          const loader=readFileSync('velour-v4.4.38-vault-accept-hotfix.js','utf8');
          const index=readFileSync('index.html','utf8');
          const canonical=readFileSync('scripts/build-github-pages-canonical.mjs','utf8');

          assert.match(ensemble,/const VERSION='1\.0\.2'/);
          const tagBlock=(ensemble.match(/if\(target\?\.dataset\?\.tagId\)\{[\s\S]*?scheduleDraftPatch\(\);return;\}/)||[])[0]||'';
          assert.ok(tagBlock,'tag click block missing');
          assert.doesNotMatch(tagBlock,/wrap\.remove\(\)|renderUI\(\)/,'multi-select tag click must not rebuild/close the card');
          assert.match(tagBlock,/querySelectorAll/,'tag styles should update in place');
          assert.match(tagBlock,/aria-pressed/);

          assert.match(authoring,/const VERSION = '1\.0\.1'/);
          assert.match(authoring,/assign\(cfg\.heroine,'role',occB\)/);
          assert.match(authoring,/assign\(cfg\.partners\[0\],'role',occA\)/);
          assert.match(authoring,/kind === 'heroine' \? selectedText\('v4OccB'\) : selectedText\('v4OccA'\)/);
          assert.match(authoring,/여주 적극성은 위 SCENE AGENCY에서 설정/);
          assert.match(authoring,/이 상대의 적극성은 이 카드에서 개별 설정/);

          assert.match(loader,/ensemble-character-preferences\.js\?v=2/);
          assert.match(loader,/authoring-experience-v1\.js\?v=2/);
          assert.match(index,/vault-accept-hotfix\.js\?v=28/);
          assert.match(canonical,/vault-accept-hotfix\.js\?v=28/);
          console.log('PASS: character multi-select stays open, occupation mapping is corrected, and agency authority is explicit');
          EOF

      - name: Run syntax and regression suite
        run: |
          node --check velour-v4.4.38-ensemble-character-preferences.js
          node --check velour-v4.4.38-authoring-experience-v1.js
          node --check velour-v4.4.38-vault-accept-hotfix.js
          node scripts/test-character-card-interaction-fix.mjs
          node scripts/test-ensemble-character-preferences.mjs
          node scripts/test-intimacy-preference-depth.mjs
          node scripts/test-authoring-experience-v1.mjs
          node scripts/test-live-canon-scene-governor.mjs
          node scripts/test-verbal-chemistry-refinement.mjs
          node scripts/test-concept-relationship-governor.mjs

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add velour-v4.4.38-ensemble-character-preferences.js velour-v4.4.38-authoring-experience-v1.js velour-v4.4.38-vault-accept-hotfix.js index.html scripts/build-github-pages-canonical.mjs scripts/test-character-card-interaction-fix.mjs
          git commit -m "Fix character multiselect and occupation mapping"
          git push origin HEAD:fix/character-multiselect-stays-open
