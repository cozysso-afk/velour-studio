name: one-to-many-name-depth-audit

on:
  push:
    branches:
      - fix/one-to-many-name-depth-controls

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/one-to-many-name-depth-controls
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch one-to-many name and depth UI
        run: python scripts/patch-one-to-many-name-depth.py
      - name: Run regressions
        run: |
          node --check velour-v4.4.38-ui-hierarchy-v2.js
          node scripts/test-one-to-many-name-depth-controls.mjs
          node scripts/test-ui-hierarchy-v2.mjs
          node scripts/test-name-roster-focus.mjs
          node scripts/test-intimacy-preference-depth.mjs
          node scripts/test-ensemble-character-preferences.mjs
          node scripts/test-authoring-experience-v1.mjs
          node scripts/test-live-canon-scene-governor.mjs
          node scripts/test-narrative-variation-v2.mjs
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add velour-v4.4.38-ui-hierarchy-v2.js index.html scripts/build-github-pages-canonical.mjs scripts/test-ui-hierarchy-v2.mjs scripts/test-one-to-many-name-depth-controls.mjs
          git commit -m "Fix one-to-many name lag and depth controls"
          git push origin HEAD:fix/one-to-many-name-depth-controls
