name: character-narrative-audit

on:
  push:
    branches:
      - feat/ui-hierarchy-cleanup-v1

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ui-hierarchy-cleanup-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Patch character authority and UI roster
        run: |
          python - <<'PY'
          from pathlib import Path

          # 1) UI hierarchy: one visible name roster; detailed intimacy owns caress/stimulus UI.
          p=Path('velour-v4.4.38-ui-hierarchy-v2.js')
          s=p.read_text()
          s=s.replace("const VERSION='1.0.0';", "const VERSION='1.1.0';")
          s=s.replace("      .velour-v2-pref-source{display:none!important}\n", """      .velour-v2-name-roster{display:grid;gap:7px;margin-bottom:9px}\n      .velour-v2-name-row{display:grid;grid-template-columns:74px minmax(0,1fr);gap:8px;align-items:center}\n      .velour-v2-name-row label{font-size:11px;color:#d5c2c8;font-weight:700}\n      .velour-v2-name-row input{min-width:0;min-height:42px;border-radius:9px;font-size:12.5px;padding:8px 10px;background:rgba(14,4,9,.96);color:#f7ece6;border:1px solid rgba(239,194,112,.20)}\n      .velour-v2-name-source,.velour-v2-pref-source{display:none!important}\n""")
          marker="""  function cleanName(card,index){\n"""
          insert="""  function rebuildNameRoster(ctx,ensemble,force=false){\n    if(!ctx?.profileBody||!ensemble)return;\n    const cards=Array.from(ensemble.querySelectorAll('[data-char-kind]'));\n    const fingerprint=cards.map((card,i)=>`${card.dataset.charKind}:${card.dataset.charIndex||i}:${cleanName(card,i+1)}`).join('|');\n    let roster=document.getElementById('velourCharacterNameRoster');\n    if(roster&&!force&&roster.dataset.fingerprint===fingerprint)return;\n    roster?.remove?.();\n    roster=document.createElement('div');\n    roster.id='velourCharacterNameRoster';roster.className='velour-v2-group';roster.dataset.fingerprint=fingerprint;\n    const title=document.createElement('div');title.className='velour-v2-group-label';title.textContent='이름 · 인물 고정';\n    const note=document.createElement('div');note.className='velour-v2-hub-note';note.textContent='여기에 적은 이름이 캐릭터 이름의 단일 원본이야. 1:다에서는 상대별 이름을 모두 고정해 두면 생성 중 임의 개명이나 인물 혼동을 막을 수 있어.';\n    const list=document.createElement('div');list.className='velour-v2-name-roster';\n    cards.forEach((card,i)=>{\n      const original=card.querySelector('[data-field="name"]');if(!original)return;original.classList.add('velour-v2-name-source');\n      const row=document.createElement('div');row.className='velour-v2-name-row';\n      const label=document.createElement('label');label.textContent=card.dataset.charKind==='heroine'?'여주':`상대 ${Number(card.dataset.charIndex||i)+1}`;\n      const input=document.createElement('input');input.type='text';input.value=original.value||'';input.placeholder=card.dataset.charKind==='heroine'?'여주 이름':'상대 이름을 고정';\n      const sync=(kind)=>{original.value=input.value;original.dispatchEvent(new Event(kind,{bubbles:true}));const summary=card.querySelector(':scope>summary');if(summary)summary.textContent=`${card.dataset.charKind==='heroine'?'여주':`상대 ${Number(card.dataset.charIndex||i)+1}`} · ${String(input.value||'').trim()||'이름 미설정'}`;};\n      input.addEventListener('input',()=>sync('input'));input.addEventListener('change',()=>{sync('change');schedule(true);});\n      row.append(label,input);list.appendChild(row);\n    });\n    roster.append(title,note,list);\n    const firstGroup=ctx.profileBody.querySelector('.velour-v2-group');\n    if(firstGroup)ctx.profileBody.insertBefore(roster,firstGroup);else ctx.profileBody.appendChild(roster);\n  }\n\n"""
          if marker not in s: raise SystemExit('UI roster insertion marker missing')
          s=s.replace(marker,insert+marker,1)
          s=s.replace("      const caress=proxySection(card,'caress','애정 · 애무');if(caress)body.appendChild(caress);", "      const caress=depth?null:proxySection(card,'caress','애정 · 애무');if(caress)body.appendChild(caress);")
          s=s.replace("    rebuildIntimacy(ctx,ensemble,force);\n    normalizeLanguageSection();", "    rebuildNameRoster(ctx,ensemble,force);\n    rebuildIntimacy(ctx,ensemble,force);\n    normalizeLanguageSection();")
          s=s.replace("window.__VELOUR_UI_HIERARCHY_V2_QA__={VERSION,layout,rebuildIntimacy,normalizeLanguageSection};", "window.__VELOUR_UI_HIERARCHY_V2_QA__={VERSION,layout,rebuildNameRoster,rebuildIntimacy,normalizeLanguageSection};")
          p.write_text(s)

          # 2) Ensemble: names are canonical; depth module is sole detailed caress/stimulus authority.
          p=Path('velour-v4.4.38-ensemble-character-preferences.js')
          s=p.read_text()
          s=s.replace("const VERSION='1.0.2';", "const VERSION='1.0.3';")
          s=s.replace("    const caressCandidates=focus?mutualCaressCandidates(cfg.heroine,focus):[];", "    const depthActive=!!window.__VELOUR_INTIMACY_PREFERENCE_DEPTH_QA__;\n    const caressCandidates=!depthActive&&focus?mutualCaressCandidates(cfg.heroine,focus):[];")
          s=s.replace("- 모든 말투·성격·성향은 캐릭터별로 독립 유지한다. 다른 인물의 말버릇·지식·감정·관계 권리를 복사하지 않는다.\n", "- 모든 말투·성격·성향은 캐릭터별로 독립 유지한다. 다른 인물의 말버릇·지식·감정·관계 권리를 복사하지 않는다.\n- 아래 캐릭터 프로필의 이름은 고정 식별자다. 사용자 이번 화 지시나 HARD CANON이 명시적으로 개명하지 않는 한 새 본명·별명을 임의 생성하거나 서로의 이름을 바꾸지 않는다.\n- 1:다에서는 각 상대의 이름·말투·관계메모·지식·감정 상태를 해당 edge에 묶고 다른 상대에게 전이하지 않는다.\n")
          old="""${preferenceLine(cfg.heroine,CARESS_CATALOG,'caressModes','애정·애무')}\n${focus?preferenceLine(focus,CARESS_CATALOG,'caressModes','애정·애무'):''}\n"""
          new="""${depthActive?'- 애정·애무/자극 상세 취향은 뒤의 INTIMACY PREFERENCE DEPTH가 단일 권위다. 이 레거시 caress 저장값은 하위호환용으로만 유지하며 중복 지시하지 않는다.':preferenceLine(cfg.heroine,CARESS_CATALOG,'caressModes','애정·애무')}\n${depthActive?'':(focus?preferenceLine(focus,CARESS_CATALOG,'caressModes','애정·애무'):'')}\n"""
          if old not in s: raise SystemExit('ensemble caress block not found')
          s=s.replace(old,new,1)
          s=s.replace("- 현재 focus와 상호 허용되는 애정·애무 후보: ${caressCandidates.map(x=>x.label).join(' / ')||'없음 — 일반적인 대화/거리 조절로 대체'}.\n", "${depthActive?'- 세부 자극·플레이 후보는 INTIMACY PREFERENCE DEPTH에서만 결정한다.':`- 현재 focus와 상호 허용되는 애정·애무 후보: ${caressCandidates.map(x=>x.label).join(' / ')||'없음 — 일반적인 대화/거리 조절로 대체'}.`}\n")
          p.write_text(s)

          # 3) Loader order: narrative architecture before final live canon.
          p=Path('velour-v4.4.38-vault-accept-hotfix.js')
          s=p.read_text()
          marker="__velourLoadHotfix('__VELOUR_LIVE_CANON_SCENE_GOVERNOR_LOADER__','./velour-v4.4.38-live-canon-scene-governor.js?v=1');"
          add="__velourLoadHotfix('__VELOUR_NARRATIVE_VARIATION_V2_LOADER__','./velour-v4.4.38-narrative-variation-v2.js?v=1');\n"+marker
          if 'NARRATIVE_VARIATION_V2_LOADER' not in s:
              if marker not in s: raise SystemExit('live canon loader marker missing')
              s=s.replace(marker,add,1)
          p.write_text(s)

          # 4) Browser/cache wiring.
          for name in ['index.html','scripts/build-github-pages-canonical.mjs']:
              p=Path(name);s=p.read_text()
              s=s.replace('velour-v4.4.38-vault-accept-hotfix.js?v=30','velour-v4.4.38-vault-accept-hotfix.js?v=31')
              s=s.replace('velour-v4.4.38-ui-hierarchy-v2.js?v=1','velour-v4.4.38-ui-hierarchy-v2.js?v=2')
              p.write_text(s)

          # Current regression expectations.
          for name in ['scripts/test-core-character-textarea.mjs','scripts/test-authoring-experience-v1.mjs','scripts/test-character-card-interaction-fix.mjs','scripts/test-verbal-chemistry-v2.mjs','scripts/test-ui-hierarchy-v2.mjs']:
              p=Path(name);s=p.read_text().replace('v=30','v=31').replace('ui-hierarchy-v2\\.js\\?v=1','ui-hierarchy-v2\\.js\\?v=2').replace("const VERSION='1\\.0\\.0'","const VERSION='1\\.1\\.0'")
              p.write_text(s)
          p=Path('scripts/test-ensemble-character-preferences.mjs')
          s=p.read_text().replace("'1.0.2'","'1.0.3'")
          p.write_text(s)
          PY

      - name: Add narrative and authority regression
        run: |
          cat > scripts/test-narrative-variation-v2.mjs <<'EOF'
          #!/usr/bin/env node
          import assert from 'node:assert/strict';
          import vm from 'node:vm';
          import { readFileSync } from 'node:fs';
          const source=readFileSync('velour-v4.4.38-narrative-variation-v2.js','utf8');
          const elements=new Map([
            ['inputChars',{value:'서진과 하윤'}],['v33Next',{value:''}]
          ]);
          const window={buildPrompt:()=> 'BASE',__VELOUR_V4_STATE_SNAPSHOT__:()=>({world:'modern',relationship:'friends',runtime:{confirmedEpisode:4,scenes:[]}})};
          const context={window,document:{getElementById:id=>elements.get(id)||null},console,setTimeout,clearTimeout};context.globalThis=context;
          vm.runInNewContext(source,context,{filename:'narrative'});
          assert.equal(window.__VELOUR_NARRATIVE_VARIATION_V2_VERSION__,'1.0.0');
          const qa=window.__VELOUR_NARRATIVE_VARIATION_V2_QA__;assert.ok(qa);
          assert.ok(qa.STRUCTURES.length>=10);assert.ok(qa.CONVERSATIONS.length>=10);assert.ok(qa.ENDINGS.length>=8);
          const p5=qa.plan(window.__VELOUR_V4_STATE_SNAPSHOT__());
          const p6=qa.plan({...window.__VELOUR_V4_STATE_SNAPSHOT__(),runtime:{confirmedEpisode:5,scenes:[]}});
          assert.notEqual(p5.structure[0],p6.structure[0],'consecutive episodes should rotate macro structure');
          const prompt=window.buildPrompt(false);
          assert.match(prompt,/CAUSAL BUILDUP.*인과관계 검사/);
          assert.match(prompt,/모든 화를 ‘일상 시작/);
          assert.match(prompt,/Scene Governor는 장소\/상황 후보/);
          assert.match(prompt,/Contextual Dialogue는 개별 대사의 기능/);
          assert.match(prompt,/Verbal Chemistry는 말하는 태도·전략/);
          console.log('PASS: narrative governor rotates episode macro structure and separates dialogue/scene authorities');
          EOF

          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/test-ui-hierarchy-v2.mjs');s=p.read_text()
          s=s.replace("assert.match(ui,/velourCharacterProfileHub/);", "assert.match(ui,/velourCharacterProfileHub/);\nassert.match(ui,/velourCharacterNameRoster/);\nassert.match(ui,/이름 · 인물 고정/);\nassert.match(ui,/velour-v2-name-source/);\nassert.match(ui,/const caress=depth\\?null:proxySection/);")
          s=s.replace("assert.match(index,/velour-v4\\.4\\.38-ui-hierarchy-v2\\.js\\?v=2/);", "assert.match(index,/velour-v4\\.4\\.38-ui-hierarchy-v2\\.js\\?v=2/);\nassert.match(index,/velour-v4\\.4\\.38-vault-accept-hotfix\\.js\\?v=31/);")
          p.write_text(s)
          PY

      - name: Run full regression suite
        run: |
          node --check velour-v4.4.38-ui-hierarchy-v2.js
          node --check velour-v4.4.38-narrative-variation-v2.js
          node --check velour-v4.4.38-ensemble-character-preferences.js
          node --check velour-v4.4.38-vault-accept-hotfix.js
          node scripts/test-ui-hierarchy-v2.mjs
          node scripts/test-narrative-variation-v2.mjs
          node scripts/test-core-character-textarea.mjs
          node scripts/test-authoring-experience-v1.mjs
          node scripts/test-character-card-interaction-fix.mjs
          node scripts/test-ensemble-character-preferences.mjs
          node scripts/test-intimacy-preference-depth.mjs
          node scripts/test-live-canon-scene-governor.mjs
          node scripts/test-concept-relationship-governor.mjs
          node scripts/test-verbal-chemistry-v2.mjs
          node scripts/test-verbal-chemistry-refinement.mjs

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html scripts/build-github-pages-canonical.mjs velour-v4.4.38-ui-hierarchy-v2.js velour-v4.4.38-ensemble-character-preferences.js velour-v4.4.38-vault-accept-hotfix.js scripts/test-ui-hierarchy-v2.mjs scripts/test-narrative-variation-v2.mjs scripts/test-core-character-textarea.mjs scripts/test-authoring-experience-v1.mjs scripts/test-character-card-interaction-fix.mjs scripts/test-verbal-chemistry-v2.mjs scripts/test-ensemble-character-preferences.mjs
          git commit -m "Fix character identity and diversify episode architecture"
          git push origin HEAD:feat/ui-hierarchy-cleanup-v1
