name: verbal-chemistry-v22-check

on:
  push:
    branches:
      - fix/verbal-chemistry-language-firewall

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/verbal-chemistry-language-firewall
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check V2.2
        run: |
          node --check velour-v4.4.38-verbal-chemistry-v2.js
          node --check velour-v4.4.38-verbal-chemistry-refinement.js
          node --check velour-v4.4.38-vault-language-firewall.js
      - name: Regression test
        run: node scripts/test-verbal-chemistry-refinement.mjs
      - name: Bust production loader cache
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in ['index.html','scripts/build-github-pages-canonical.mjs']:
              p=Path(name)
              s=p.read_text()
              s=s.replace('velour-v4.4.38-vault-accept-hotfix.js?v=20','velour-v4.4.38-vault-accept-hotfix.js?v=21')
              p.write_text(s)
          PY
      - name: Commit cache bump if needed
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html scripts/build-github-pages-canonical.mjs
          git commit -m "Bust Verbal Chemistry V2.2 loader cache"
          git push origin HEAD:fix/verbal-chemistry-language-firewall
