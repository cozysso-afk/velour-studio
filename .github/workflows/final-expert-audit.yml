name: final-expert-audit

on:
  push:
    branches:
      - feat/ensemble-character-preferences-v2

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ensemble-character-preferences-v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply final audit cache fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('velour-v4.4.38-intimacy-preference-depth.js')
          s = p.read_text()
          s = s.replace("'\\\"':'&quot'", "'\\\"':'&quot;'")
          p.write_text(s)

          p = Path('velour-v4.4.38-vault-accept-hotfix.js')
          s = p.read_text()
          s = s.replace('velour-v4.4.38-intimacy-preference-depth.js?v=1', 'velour-v4.4.38-intimacy-preference-depth.js?v=2')
          p.write_text(s)

          p = Path('scripts/test-verbal-chemistry-v2.mjs')
          s = p.read_text()
          s = s.replace("assert.equal(window.__VELOUR_VERBAL_CHEMISTRY_VERSION__, '2.0.0');", "assert.equal(window.__VELOUR_VERBAL_CHEMISTRY_VERSION__, '2.2.0');")
          s = s.replace(r"assert.match(loader,/velour-v4\\.4\\.38-verbal-chemistry-v2\\.js\\?v=1/);", r"assert.match(loader,/velour-v4\\.4\\.38-verbal-chemistry-v2\\.js\\?v=2/);")
          s = s.replace(r"assert.match(canonical,/vault-accept-hotfix\\.js\\?v=19/);", r"assert.match(canonical,/vault-accept-hotfix\\.js\\?v=26/);")
          p.write_text(s)

          for name in ['index.html', 'scripts/build-github-pages-canonical.mjs']:
              p = Path(name)
              s = p.read_text()
              if 'velour-v4.4.38-vault-accept-hotfix.js?v=25' in s:
                  s = s.replace('velour-v4.4.38-vault-accept-hotfix.js?v=25', 'velour-v4.4.38-vault-accept-hotfix.js?v=26')
              elif 'velour-v4.4.38-vault-accept-hotfix.js?v=26' not in s:
                  raise SystemExit(f'{name}: expected parent loader cache v25/v26 not found')
              p.write_text(s)
          PY
      - name: Syntax checks
        run: |
          node --check velour-v4.4.38-ensemble-character-preferences.js
          node --check velour-v4.4.38-intimacy-preference-depth.js
          node --check velour-v4.4.38-vault-accept-hotfix.js
          node --check velour-v4.4.38-live-canon-scene-governor.js
      - name: New feature regressions
        run: |
          node scripts/test-ensemble-character-preferences.mjs
          node scripts/test-intimacy-preference-depth.mjs
      - name: Existing critical regressions
        run: |
          node scripts/test-live-canon-scene-governor.mjs
          node scripts/test-verbal-chemistry-refinement.mjs
          node scripts/test-concept-relationship-governor.mjs
          node scripts/test-verbal-chemistry-v2.mjs
      - name: Verify loader ordering and cache
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const loader=fs.readFileSync('velour-v4.4.38-vault-accept-hotfix.js','utf8');
          const ensemble=loader.indexOf('__VELOUR_ENSEMBLE_CHARACTER_PREFERENCES_LOADER__');
          const depth=loader.indexOf('__VELOUR_INTIMACY_PREFERENCE_DEPTH_LOADER__');
          const canon=loader.indexOf('__VELOUR_LIVE_CANON_SCENE_GOVERNOR_LOADER__');
          if(!(ensemble>0 && depth>ensemble && canon>depth)) throw new Error('loader order invalid');
          if(!/intimacy-preference-depth\.js\?v=2/.test(loader)) throw new Error('depth cache not bumped');
          for(const name of ['index.html','scripts/build-github-pages-canonical.mjs']){
            const s=fs.readFileSync(name,'utf8');
            if(!/vault-accept-hotfix\.js\?v=26/.test(s)) throw new Error(name+' parent cache not bumped');
          }
          NODE
      - name: Commit audit fixes if needed
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add velour-v4.4.38-intimacy-preference-depth.js velour-v4.4.38-vault-accept-hotfix.js scripts/test-verbal-chemistry-v2.mjs index.html scripts/build-github-pages-canonical.mjs
          git commit -m "Finalize ensemble intimacy preference audit"
          git push origin HEAD:feat/ensemble-character-preferences-v2
