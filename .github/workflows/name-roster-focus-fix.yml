name: name-roster-focus-fix

on:
  push:
    branches:
      - fix/name-roster-input-focus

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/name-roster-input-focus
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Patch roster focus handling
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('velour-v4.4.38-ui-hierarchy-v2.js')
          s=p.read_text()
          s=s.replace("const VERSION='1.1.0';", "const VERSION='1.1.1';")
          old="    let roster=document.getElementById('velourCharacterNameRoster');\n    if(roster&&!force&&roster.dataset.fingerprint===fingerprint)return;\n    roster?.remove?.();\n"
          new="    let roster=document.getElementById('velourCharacterNameRoster');\n    // Never replace the active name editor while the user is typing.\n    if(roster&&roster.contains(document.activeElement))return;\n    if(roster&&!force&&roster.dataset.fingerprint===fingerprint)return;\n    roster?.remove?.();\n"
          if old not in s: raise SystemExit('roster guard marker missing')
          s=s.replace(old,new,1)
          old="      const sync=(kind)=>{original.value=input.value;original.dispatchEvent(new Event(kind,{bubbles:true}));const summary=card.querySelector(':scope>summary');if(summary)summary.textContent=`${card.dataset.charKind==='heroine'?'여주':`상대 ${Number(card.dataset.charIndex||i)+1}`} · ${String(input.value||'').trim()||'이름 미설정'}`;};\n      input.addEventListener('input',()=>sync('input'));input.addEventListener('change',()=>{sync('change');schedule(true);});\n"
          new="      const syncValue=(kind)=>{original.value=input.value;original.dispatchEvent(new Event(kind,{bubbles:true}));};\n      const syncSummary=()=>{const summary=card.querySelector(':scope>summary');if(summary)summary.textContent=`${card.dataset.charKind==='heroine'?'여주':`상대 ${Number(card.dataset.charIndex||i)+1}`} · ${String(input.value||'').trim()||'이름 미설정'}`;};\n      input.addEventListener('input',()=>syncValue('input'));\n      input.addEventListener('change',()=>{syncValue('change');syncSummary();schedule(true);});\n"
          if old not in s: raise SystemExit('name input listener marker missing')
          s=s.replace(old,new,1)
          p.write_text(s)
          for name in ['index.html','scripts/build-github-pages-canonical.mjs']:
              p=Path(name)
              p.write_text(p.read_text().replace('velour-v4.4.38-ui-hierarchy-v2.js?v=2','velour-v4.4.38-ui-hierarchy-v2.js?v=3'))
          p=Path('scripts/test-ui-hierarchy-v2.mjs')
          t=p.read_text().replace("const VERSION='1\\.1\\.0'","const VERSION='1\\.1\\.1'").replace('ui-hierarchy-v2\\.js\\?v=2','ui-hierarchy-v2\\.js\\?v=3')
          p.write_text(t)
          PY

      - name: Add focus regression
        run: |
          cat > scripts/test-name-roster-focus.mjs <<'EOF'
          #!/usr/bin/env node
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const ui=readFileSync('velour-v4.4.38-ui-hierarchy-v2.js','utf8');
          const index=readFileSync('index.html','utf8');
          const canonical=readFileSync('scripts/build-github-pages-canonical.mjs','utf8');
          assert.match(ui,/const VERSION='1\.1\.1'/);
          assert.match(ui,/roster&&roster\.contains\(document\.activeElement\)/);
          const rawInputLine=(ui.match(/input\.addEventListener\('input'[^\n]*/)||[])[0]||'';
          assert.match(rawInputLine,/syncValue\('input'\)/);
          assert.doesNotMatch(rawInputLine,/syncSummary|schedule\(true\)/);
          assert.match(ui,/input\.addEventListener\('change',[^\n]*syncSummary\(\)[^\n]*schedule\(true\)/);
          assert.match(index,/ui-hierarchy-v2\.js\?v=3/);
          assert.match(canonical,/ui-hierarchy-v2\.js\?v=3/);
          console.log('PASS: name roster preserves focus while typing');
          EOF

      - name: Run regression
        run: |
          node --check velour-v4.4.38-ui-hierarchy-v2.js
          node scripts/test-name-roster-focus.mjs
          node scripts/test-ui-hierarchy-v2.mjs
          node scripts/test-character-card-interaction-fix.mjs
          node scripts/test-ensemble-character-preferences.mjs
          node scripts/test-authoring-experience-v1.mjs

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add velour-v4.4.38-ui-hierarchy-v2.js index.html scripts/build-github-pages-canonical.mjs scripts/test-ui-hierarchy-v2.mjs scripts/test-name-roster-focus.mjs
          git commit -m "Keep character name input focused while typing"
          git push origin HEAD:fix/name-roster-input-focus
