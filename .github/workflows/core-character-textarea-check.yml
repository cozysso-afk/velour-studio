name: core-character-textarea-check

on:
  push:
    branches:
      - fix/core-character-textarea-prompt-bloat

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/core-character-textarea-prompt-bloat
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Patch core character memo textarea
        run: |
          python - <<'PY'
          from pathlib import Path

          # Static field: real multiline textarea from first paint.
          p=Path('index.html')
          s=p.read_text()
          old='''<input type="text" id="inputChars" placeholder="예: 단정하지만 속을 숨긴 과외선생 \'서진\' × 아슬아슬하게 선을 넘는 제자 \'하은\'">'''
          new='''<textarea id="inputChars" rows="5" wrap="soft" placeholder="예: 단정하지만 속을 숨긴 과외선생 \'서진\' × 아슬아슬하게 선을 넘는 제자 \'하은\'"></textarea>'''
          if old not in s:
              raise SystemExit('index inputChars source field not found')
          s=s.replace(old,new,1)
          s=s.replace('velour-v4.4.38-vault-accept-hotfix.js?v=28','velour-v4.4.38-vault-accept-hotfix.js?v=29')
          p.write_text(s)

          # Mobile authoring layer: larger default height + grow with content.
          p=Path('velour-v4.4.38-authoring-experience-v1.js')
          s=p.read_text()
          s=s.replace("const VERSION = '1.0.1';", "const VERSION = '1.0.2';")
          s=s.replace('.velour-primary-story-card #inputChars{min-height:70px!important}', '.velour-primary-story-card #inputChars{min-height:112px!important;line-height:1.55!important;white-space:pre-wrap!important}')
          marker='''  function hideLegacyVisualProfile(){'''
          fn='''  function setupCoreCharacterTextarea(){\n    const input = document.getElementById('inputChars');\n    if (!input || String(input.tagName || '').toUpperCase() !== 'TEXTAREA') return false;\n    input.rows = 5;\n    input.setAttribute('wrap','soft');\n    input.style.resize = 'vertical';\n    const autoGrow = () => {\n      input.style.height = 'auto';\n      const height = Math.min(Math.max(Number(input.scrollHeight || 0),112),320);\n      input.style.height = `${height}px`;\n      input.style.overflowY = Number(input.scrollHeight || 0) > 320 ? 'auto' : 'hidden';\n    };\n    if (input.dataset.velourAutoGrow !== '1') {\n      input.dataset.velourAutoGrow = '1';\n      input.addEventListener('input', autoGrow);\n    }\n    autoGrow();\n    return true;\n  }\n\n'''
          if marker not in s:
              raise SystemExit('authoring insertion marker not found')
          s=s.replace(marker,fn+marker,1)
          s=s.replace('''    updatePrimaryLabels();\n    hideLegacyVisualProfile();''','''    updatePrimaryLabels();\n    setupCoreCharacterTextarea();\n    hideLegacyVisualProfile();''',1)
          p.write_text(s)

          # Loader/cache bust.
          p=Path('velour-v4.4.38-vault-accept-hotfix.js')
          s=p.read_text().replace('velour-v4.4.38-authoring-experience-v1.js?v=2','velour-v4.4.38-authoring-experience-v1.js?v=3')
          p.write_text(s)

          p=Path('scripts/build-github-pages-canonical.mjs')
          s=p.read_text().replace('velour-v4.4.38-vault-accept-hotfix.js?v=28','velour-v4.4.38-vault-accept-hotfix.js?v=29')
          p.write_text(s)

          # Keep existing regression expectations current.
          p=Path('scripts/test-authoring-experience-v1.mjs')
          s=p.read_text()
          s=s.replace("const VERSION = '1\\.0\\.1'", "const VERSION = '1\\.0\\.2'") if False else s
          s=s.replace("/const VERSION = '1\\.0\\.1'/", "/const VERSION = '1\\.0\\.2'/")
          s=s.replace('authoring-experience-v1\\.js\\?v=2','authoring-experience-v1\\.js\\?v=3')
          s=s.replace('vault-accept-hotfix\\.js\\?v=28','vault-accept-hotfix\\.js\\?v=29')
          p.write_text(s)

          p=Path('scripts/test-character-card-interaction-fix.mjs')
          s=p.read_text()
          s=s.replace('authoring-experience-v1\\.js\\?v=2','authoring-experience-v1\\.js\\?v=3')
          s=s.replace('vault-accept-hotfix\\.js\\?v=28','vault-accept-hotfix\\.js\\?v=29')
          p.write_text(s)
          PY

      - name: Add textarea regression check
        run: |
          cat > scripts/test-core-character-textarea.mjs <<'EOF'
          #!/usr/bin/env node
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const index=readFileSync('index.html','utf8');
          const authoring=readFileSync('velour-v4.4.38-authoring-experience-v1.js','utf8');
          const loader=readFileSync('velour-v4.4.38-vault-accept-hotfix.js','utf8');
          const canonical=readFileSync('scripts/build-github-pages-canonical.mjs','utf8');
          assert.match(index,/<textarea id="inputChars" rows="5" wrap="soft"[^>]*><\/textarea>/);
          assert.doesNotMatch(index,/<input[^>]+id="inputChars"/);
          assert.match(authoring,/const VERSION = '1\.0\.2'/);
          assert.match(authoring,/function setupCoreCharacterTextarea\(\)/);
          assert.match(authoring,/input\.addEventListener\('input', autoGrow\)/);
          assert.match(authoring,/min-height:112px/);
          assert.match(loader,/authoring-experience-v1\.js\?v=3/);
          assert.match(index,/vault-accept-hotfix\.js\?v=29/);
          assert.match(canonical,/vault-accept-hotfix\.js\?v=29/);
          console.log('PASS: core character memo is multiline and auto-grows on mobile');
          EOF

      - name: Run regression suite
        run: |
          node --check velour-v4.4.38-authoring-experience-v1.js
          node --check velour-v4.4.38-vault-accept-hotfix.js
          node scripts/test-core-character-textarea.mjs
          node scripts/test-authoring-experience-v1.mjs
          node scripts/test-character-card-interaction-fix.mjs
          node scripts/test-ensemble-character-preferences.mjs
          node scripts/test-live-canon-scene-governor.mjs
          node scripts/test-concept-relationship-governor.mjs
          node scripts/test-verbal-chemistry-refinement.mjs

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html velour-v4.4.38-authoring-experience-v1.js velour-v4.4.38-vault-accept-hotfix.js scripts/build-github-pages-canonical.mjs scripts/test-authoring-experience-v1.mjs scripts/test-character-card-interaction-fix.mjs scripts/test-core-character-textarea.mjs
          git commit -m "Make core character memo multiline"
          git push origin HEAD:fix/core-character-textarea-prompt-bloat
