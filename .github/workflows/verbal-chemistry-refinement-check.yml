name: verbal-chemistry-refinement-check

on:
  push:
    branches:
      - fix/verbal-chemistry-language-firewall

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/verbal-chemistry-language-firewall
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: node --check velour-v4.4.38-verbal-chemistry-refinement.js
      - name: Regression test
        run: node scripts/test-verbal-chemistry-refinement.mjs
      - name: Bust production loader cache
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('velour-v4.4.38-vault-accept-hotfix.js?v=17','velour-v4.4.38-vault-accept-hotfix.js?v=20')
          p.write_text(s)
          p=Path('scripts/build-github-pages-canonical.mjs')
          s=p.read_text().replace('velour-v4.4.38-vault-accept-hotfix.js?v=19','velour-v4.4.38-vault-accept-hotfix.js?v=20')
          p.write_text(s)
          PY
      - name: Commit cache bump if needed
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html scripts/build-github-pages-canonical.mjs
          git commit -m "Bust Verbal Chemistry refinement loader cache"
          git push origin HEAD:fix/verbal-chemistry-language-firewall
