name: wardrobe-continuity-audit

on:
  push:
    branches:
      - fix/episode-wardrobe-continuity

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/episode-wardrobe-continuity
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch wardrobe continuity
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('velour-v4.4.38-live-canon-scene-governor.js')
          s=p.read_text()
          s=s.replace("const VERSION='1.0.0';","const VERSION='1.1.0';",1)
          old="- 한 화 안에서 착용 상태와 손에 든 소품은 사건으로 추적한다. 본문에 벗음·입음·갈아입음·건네줌·놓아둠 같은 변화가 실제로 쓰이지 않았다면 새 의복/소품을 편의상 생성하거나 기존 것을 다른 것으로 바꾸지 않는다.\n- 장면의 분위기나 친밀도가 바뀌었다는 이유만으로 셔츠·재킷·바지 같은 새 품목을 자동 생성하지 않는다. 직전 확정 문단의 상태를 이어받는다."
          new="- 이번 화 안에서는 인물별 착장 ledger를 유지한다. 상의/하의/겉옷/신발/주요 액세서리 슬롯별로 현재 상태를 기억하고, HARD CANON에 명시된 품목이 있으면 그것을 초기값이자 최우선값으로 사용한다.\n- HARD CANON에 없는 슬롯은 이번 화에서 처음 명시된 착장을 그 슬롯의 현재값으로 확정한다. 같은 연속 시간대에서는 이후 문단과 장면이 바뀌어도 그 값을 그대로 이어받는다.\n- 나시→반팔, 치마→바지처럼 같은 슬롯의 품목이 달라지려면 본문에 벗음·입음·갈아입음·샤워 후 재착용 같은 명시적 전환 행동이 먼저 있어야 한다. 단순 장소 이동·대화 전환·분위기 변화만으로는 변경할 수 없다.\n- 명확한 다음날/긴 시간 점프 뒤 새 착장을 제시할 수는 있지만, 시간 점프와 새 착장을 독자가 알 수 있게 서술한다. 같은 장면 또는 연속 시간대에서 설명 없는 교체는 금지한다.\n- 겹쳐 입는 설정이 명시되지 않았다면 서로 배타적인 상의/하의 두 개를 동시에 현재 착장처럼 서술하지 않는다. 소품도 건네줌·놓아둠·다시 집음 같은 사건 없이 위치나 소유자를 바꾸지 않는다.\n- 출력 직전 내부적으로 인물별 착장 ledger와 본문을 대조한다. 설명 없는 의상/소품 교체가 있으면 해당 문장을 직전 확정 상태에 맞게 조용히 수정한 뒤 최종 본문만 출력한다. ledger나 점검표 자체는 출력하지 않는다."
          if old not in s: raise SystemExit('wardrobe directive marker missing')
          s=s.replace(old,new,1)
          p.write_text(s)

          p=Path('velour-v4.4.38-vault-accept-hotfix.js')
          t=p.read_text().replace('live-canon-scene-governor.js?v=1','live-canon-scene-governor.js?v=2',1)
          p.write_text(t)

          p=Path('scripts/test-live-canon-scene-governor.mjs')
          t=p.read_text()
          t=t.replace("'1.0.0'","'1.1.0'",1)
          t=t.replace("assert.match(prompt,/새 의복\\/소품을 편의상 생성하거나 기존 것을 다른 것으로 바꾸지 않는다/);","assert.match(prompt,/인물별 착장 ledger를 유지한다/);\nassert.match(prompt,/나시→반팔/);\nassert.match(prompt,/명확한 다음날\\/긴 시간 점프/);\nassert.match(prompt,/출력 직전 내부적으로 인물별 착장 ledger와 본문을 대조한다/);")
          t=t.replace('live-canon-scene-governor\\.js\\?v=1','live-canon-scene-governor\\.js\\?v=2',1)
          p.write_text(t)
          PY
      - name: Run regression
        run: |
          node --check velour-v4.4.38-live-canon-scene-governor.js
          node scripts/test-live-canon-scene-governor.mjs
          node scripts/test-authoring-experience-v1.mjs
          node scripts/test-intimacy-preference-depth.mjs
          node scripts/test-ensemble-character-preferences.mjs
          node scripts/test-narrative-variation-v2.mjs
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add velour-v4.4.38-live-canon-scene-governor.js velour-v4.4.38-vault-accept-hotfix.js scripts/test-live-canon-scene-governor.mjs
          git commit -m "Lock wardrobe continuity within episodes"
          git push origin HEAD:fix/episode-wardrobe-continuity
