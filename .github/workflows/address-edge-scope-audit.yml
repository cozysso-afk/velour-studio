name: address-edge-scope-audit

on:
  push:
    branches:
      - fix/address-edge-leak

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/address-edge-leak
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch address edge scoping
        run: python scripts/patch-address-edge-leak.py
      - name: Run regressions
        run: |
          node --check velour-v4.4.38-continuity-voice-guard.js
          node scripts/test-address-edge-scope.mjs
          node scripts/test-dialogue-continuity-regression.mjs
          node scripts/test-dirty-talk-frequency.mjs
          node scripts/test-ensemble-character-preferences.mjs
          node scripts/test-authoring-experience-v1.mjs
          node scripts/test-live-canon-scene-governor.mjs
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add velour-v4.4.38-continuity-voice-guard.js index.html scripts/build-github-pages-canonical.mjs scripts/test-dirty-talk-frequency.mjs scripts/test-dialogue-continuity-regression.mjs scripts/test-address-edge-scope.mjs
          git commit -m "Scope address canon to character edges"
          git push origin HEAD:fix/address-edge-leak
