name: One-shot VELOUR continuity and dialogue repair

on:
  push:
    paths:
      - '.github/workflows/one-shot-pages-loader-cache-bump.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch continuity and dialogue owners
        env:
          PATCH_B64: "§무 할당하지 않는다. 지금 실제로 보이거나 접촉·자세·옷차림 때문에 강조된 특징이 있을 때 자연스럽게 선택한다.' : medium ? '친밀 장면에서는 외형/몸 반응 대사를 장면 맥락이 만들 때 자연스럽게 선택하고, 최근에 같은 부위·같은 평가를 썼다면 다른 관찰이나 다른 대화 기능으로 전환한다.' : '외형 칭찬 대사는 장면상 자연스러울 때만 드물게 사용한다.';"
          s2, n = re.subn(pattern, repl, s, count=1)
          if n != 1:
              raise SystemExit('body-praise density marker not replaced')
          write(p, s2)

          p = 'velour-v4.4.38-continuity-voice-guard.js'
          s = read(p)
          s = replace_required(s, "const VERSION = '1.0.0';", "const VERSION = '1.1.0';", 'voice version')
          replacement = r'''  function dialogueVariationDirective(state){
    const dirty = Math.max(0, Math.min(100, Number(state?.dirtyTalk ?? 70)));
    const praise = String(state?.bodyPraiseDirtyTalk || 'high').toLowerCase();
    return `\n[DIALOGUE FUNCTION ROTATION — 더티톡 수위와 빈도 분리]\n- 더티톡 강도=${dirty}/100은 대사가 등장했을 때 허용되는 직접성·노골성의 상한이다. 친밀 장면마다 더티톡을 넣으라는 빈도 지시가 아니며, 강도가 높아도 매 씬·매 문단에 반복하지 않는다.\n- 더티톡의 기능을 하나로 취급하지 않는다. 몸/외형 반응, 욕망 표현, 도발·놀림, 요구·질문, 상대 반응 코멘트, 감정 노출, 감각 보고, 절정/사정 예고를 서로 다른 기능군으로 본다.\n- 감각 보고와 절정/사정 예고는 여러 기능 중 하나일 뿐 기본값이 아니다. 직전 장면이나 최근 제공 본문에서 이미 많이 썼다면 이번 장면에서는 우선순위를 크게 낮추고 다른 기능군을 선택한다.\n- 같은 의미군의 대사를 표현만 바꿔 연속 출력하지 않는다. 문장 표면이 달라도 목적이 같으면 반복으로 본다. 사용자가 이번 화에 특정 표현을 직접 요구한 경우만 예외다.\n- bodyPraiseDirtyTalk=${praise}. high/normal이면 현재 장면에서 실제로 보이거나 움직임 때문에 강조된 외형·몸 특징에 대한 반응을 적극적인 후보로 둔다. 단, 같은 부위와 같은 평가를 기계적으로 회전하거나 매 장면 의무 삽입하지 않는다.\n- 여성 인물을 신음→감각 평가→절정 예고의 수동 반응기로 고정하지 않는다. 요구, 선택, 도발, 질문, 제지, 조율, 장난, 감정 노출 등 캐릭터의 능동적 대화 기능을 섞는다.\n- 남성 인물도 감각 평가나 명령 한 종류로 고정하지 않는다. 두 사람 모두 상대가 방금 한 말·표정·행동에 실제로 응답해야 한다.\n- 신음은 대사의 대체물이 아니다. 모든 반응을 같은 음절이나 같은 절정 예고로 시작하지 않는다.\n- 다양성을 위해 캐릭터에 없는 성격·호칭을 새로 만들지 않는다. ADDRESS / AGE CANON과 HARD CANON이 우선이다.`;
  }
'''
          pattern = r"  function dialogueVariationDirective\(state\)\{.*?\n  \}\n\n(?=  function transitionSemanticsDirective\(\)\{)"
          s2, n = re.subn(pattern, replacement + '\n', s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('dialogueVariationDirective not replaced')
          write(p, s2)

          p = 'velour-v4.4.38-vault-accept-hotfix.js'
          s = read(p)
          s = replace_required(s, 'continuity-hotfix.js?v=2', 'continuity-hotfix.js?v=3', 'continuity owner cache')
          s = replace_required(s, 'continuity-vault-hotfix.js?v=4', 'continuity-vault-hotfix.js?v=5', 'continuity vault cache')
          write(p, s)

          for p in ['index.html', 'scripts/build-github-pages-canonical.mjs']:
              s = read(p)
              s = replace_required(s, 'vault-accept-hotfix.js?v=15', 'vault-accept-hotfix.js?v=16', f'{p} loader cache')
              s = replace_required(s, 'continuity-voice-guard.js?v=3', 'continuity-voice-guard.js?v=4', f'{p} voice cache')
              write(p, s)

          p = 'scripts/test-hard-canon-lock.mjs'
          s = read(p).replace('continuity-vault-hotfix\\.js\\?v=4', 'continuity-vault-hotfix\\.js\\?v=5').replace('vault-accept-hotfix\\.js\\?v=15', 'vault-accept-hotfix\\.js\\?v=16')
          write(p, s)

          p = 'scripts/test-conditional-canon.mjs'
          s = read(p)
          s = s.replace('vault-accept-hotfix.js\\?v=(?:14|15)', 'vault-accept-hotfix.js\\?v=16')
          s = s.replace('continuity-hotfix.js\\?v=2', 'continuity-hotfix.js\\?v=3')
          s = s.replace('continuity-vault-hotfix.js\\?v=4', 'continuity-vault-hotfix.js\\?v=5')
          write(p, s)

          Path('scripts/test-dialogue-continuity-regression.mjs').write_text(r'''import assert from 'node:assert/strict';
import { readFileSync } from 'node:fs';

const continuity = readFileSync('velour-v4.4.38-continuity-hotfix.js','utf8');
assert.match(continuity, /최근 확정 관계\/타임라인\/인과 연결고리 > 기타 장기 사실 > 과거 아크 요약/);
assert.match(continuity, /ARCHIVED ARC는 과거 기록 참고용이며 현재 상태의 권위가 아니다/);
assert.match(continuity, /과거 시점으로 시간축을 되감지 않는다/);

const voice = readFileSync('velour-v4.4.38-continuity-voice-guard.js','utf8');
assert.match(voice, /직접성·노골성의 상한/);
assert.match(voice, /친밀 장면마다 더티톡을 넣으라는 빈도 지시가 아니다/);
assert.match(voice, /몸\/외형 반응, 욕망 표현, 도발·놀림, 요구·질문/);
assert.match(voice, /감각 보고와 절정\/사정 예고.*기본값이 아니다/);
assert.match(voice, /문장 표면이 달라도 목적이 같으면 반복/);

const body = readFileSync('velour-v4.4.38-continuity-vault-hotfix.js','utf8');
assert.doesNotMatch(body, /2~4회 정도 분산/);
assert.match(body, /높은 우선순위 후보로 사용하되 장면마다 횟수를 의무 할당하지 않는다/);

const loader = readFileSync('velour-v4.4.38-vault-accept-hotfix.js','utf8');
assert.match(loader,/continuity-hotfix\.js\?v=3/);
assert.match(loader,/continuity-vault-hotfix\.js\?v=5/);
const html = readFileSync('index.html','utf8');
assert.match(html,/vault-accept-hotfix\.js\?v=16/);
assert.match(html,/continuity-voice-guard\.js\?v=4/);
console.log('PASS: dialogue function rotation + recent-state authority over archived arcs');
''', encoding='utf-8')
PY
      - name: Validate JavaScript and regressions
        run: |
          node --check velour-v4.4.38-continuity-hotfix.js
          node --check velour-v4.4.38-continuity-vault-hotfix.js
          node --check velour-v4.4.38-continuity-voice-guard.js
          node scripts/test-hard-canon-lock.mjs
          node scripts/test-conditional-canon.mjs
          node scripts/test-dialogue-continuity-regression.mjs
      - name: Commit repair
        run: |
          if git diff --quiet; then
            echo 'No changes needed'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add velour-v4.4.38-continuity-hotfix.js \
                  velour-v4.4.38-continuity-vault-hotfix.js \
                  velour-v4.4.38-continuity-voice-guard.js \
                  velour-v4.4.38-vault-accept-hotfix.js \
                  index.html scripts/build-github-pages-canonical.mjs \
                  scripts/test-hard-canon-lock.mjs scripts/test-conditional-canon.mjs \
                  scripts/test-dialogue-continuity-regression.mjs
          git commit -m 'Fix dialogue repetition and story regression'
          git push"}
        run: |
          python - <<'PY'
          import base64, os
          exec(base64.b64decode(os.environ['PATCH_B64']).decode('utf-8'))
          PY
      - name: Validate JavaScript and regressions
        run: |
          node --check velour-v4.4.38-continuity-hotfix.js
          node --check velour-v4.4.38-continuity-vault-hotfix.js
          node --check velour-v4.4.38-continuity-voice-guard.js
          node scripts/test-hard-canon-lock.mjs
          node scripts/test-conditional-canon.mjs
          node scripts/test-dialogue-continuity-regression.mjs
      - name: Commit repair
        run: |
          if git diff --quiet; then
            echo 'No changes needed'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add velour-v4.4.38-continuity-hotfix.js \
                  velour-v4.4.38-continuity-vault-hotfix.js \
                  velour-v4.4.38-continuity-voice-guard.js \
                  velour-v4.4.38-vault-accept-hotfix.js \
                  index.html scripts/build-github-pages-canonical.mjs \
                  scripts/test-hard-canon-lock.mjs scripts/test-conditional-canon.mjs \
                  scripts/test-dialogue-continuity-regression.mjs
          git commit -m 'Fix dialogue repetition and story regression'
          git push
