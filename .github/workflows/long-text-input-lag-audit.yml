name: long-text-input-lag-audit

on:
  push:
    branches: [fix/long-text-input-lag]

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/long-text-input-lag
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch textarea input path
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('velour-v4.4.38.js')
          s=p.read_text()
          old="function save(cfg){ try { localStorage.setItem(CFG_KEY,JSON.stringify(cfg)); } catch(e){} }"
          new="""function save(cfg){ try { localStorage.setItem(CFG_KEY,JSON.stringify(cfg)); } catch(e){} }
  let longTextSaveTimer=0;
  function scheduleLongTextSave(){
    clearTimeout(longTextSaveTimer);
    longTextSaveTimer=setTimeout(()=>{ longTextSaveTimer=0; save(state); },450);
  }
  function flushLongTextSave(){
    if(longTextSaveTimer){ clearTimeout(longTextSaveTimer); longTextSaveTimer=0; }
    save(state);
  }"""
          if old not in s: raise SystemExit('save marker missing')
          s=s.replace(old,new,1)
          old="""      const ev=(el.tagName==='TEXTAREA'||el.type==='range'||el.type==='number'||el.tagName==='INPUT')?'input':'change';
      el.addEventListener(ev,()=>{ state[key]=(el.type==='number'||el.type==='range')?Number(el.value):el.value; save(state); syncUI(false); });"""
          new="""      const ev=(el.tagName==='TEXTAREA'||el.type==='range'||el.type==='number'||el.tagName==='INPUT')?'input':'change';
      if(el.tagName==='TEXTAREA'){
        // Long-form fields must stay cheap while editing, especially for mid-text IME/cursor edits.
        // Keep state current immediately, but defer synchronous localStorage serialization and UI work.
        el.addEventListener('input',()=>{ state[key]=el.value; scheduleLongTextSave(); });
        el.addEventListener('change',()=>{ state[key]=el.value; flushLongTextSave(); syncUI(false); });
      }else{
        el.addEventListener(ev,()=>{ state[key]=(el.type==='number'||el.type==='range')?Number(el.value):el.value; save(state); syncUI(false); });
      }"""
          if old not in s: raise SystemExit('listener marker missing')
          s=s.replace(old,new,1)
          p.write_text(s)

          for name in ['index.html','scripts/build-github-pages-canonical.mjs']:
              p=Path(name); t=p.read_text().replace('velour-v4.4.38.js?v=443707','velour-v4.4.38.js?v=443708'); p.write_text(t)
          p=Path('scripts/test-dirty-talk-frequency.mjs')
          t=p.read_text().replace('velour-v4\\.4\\.38\\.js\\?v=443707','velour-v4\\.4\\.38\\.js\\?v=443708'); p.write_text(t)
          PY
      - name: Add regression test
        run: |
          cat > scripts/test-long-text-input-lag.mjs <<'EOF'
          #!/usr/bin/env node
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const core=readFileSync('velour-v4.4.38.js','utf8');
          const index=readFileSync('index.html','utf8');
          const canonical=readFileSync('scripts/build-github-pages-canonical.mjs','utf8');
          assert.match(core,/let longTextSaveTimer=0/);
          assert.match(core,/setTimeout\(\(\)=>\{ longTextSaveTimer=0; save\(state\); \},450\)/);
          assert.match(core,/if\(el\.tagName==='TEXTAREA'\)[\s\S]*addEventListener\('input',[\s\S]*scheduleLongTextSave\(\)/);
          const inputLine=(core.match(/el\.addEventListener\('input',\(\)=>\{ state\[key\]=el\.value;[^\n]*/)||[])[0]||'';
          assert.doesNotMatch(inputLine,/save\(state\)|syncUI\(/,'textarea input must not synchronously save or resync UI');
          assert.match(core,/addEventListener\('change',[\s\S]*flushLongTextSave\(\); syncUI\(false\)/);
          assert.match(index,/velour-v4\.4\.38\.js\?v=443708/);
          assert.match(canonical,/velour-v4\.4\.38\.js\?v=443708/);
          console.log('PASS: long textarea edits avoid synchronous save/UI work per keystroke');
          EOF
      - name: Run regression
        run: |
          node --check velour-v4.4.38.js
          node scripts/test-long-text-input-lag.mjs
          node scripts/test-dirty-talk-frequency.mjs
          node scripts/test-live-canon-scene-governor.mjs
          node scripts/test-concept-relationship-governor.mjs
          node scripts/test-ui-hierarchy-v2.mjs
          node scripts/test-name-roster-focus.mjs
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add velour-v4.4.38.js index.html scripts/build-github-pages-canonical.mjs scripts/test-dirty-talk-frequency.mjs scripts/test-long-text-input-lag.mjs
          git commit -m "Reduce lag while editing long settings text"
          git push origin HEAD:fix/long-text-input-lag
