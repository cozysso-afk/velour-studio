name: ensemble-character-preferences-check

on:
  push:
    branches:
      - feat/ensemble-character-preferences-v2

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ensemble-character-preferences-v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax checks
        run: |
          node --check velour-v4.4.38-ensemble-character-preferences.js
          node --check velour-v4.4.38-vault-accept-hotfix.js
          node --check velour-v4.4.38-live-canon-scene-governor.js
      - name: Ensemble regression
        run: node scripts/test-ensemble-character-preferences.mjs
      - name: Existing live canon regression
        run: node scripts/test-live-canon-scene-governor.mjs
      - name: Existing language firewall regression
        run: node scripts/test-verbal-chemistry-refinement.mjs
      - name: Existing relationship governor regression
        run: node scripts/test-concept-relationship-governor.mjs
      - name: Ensure production parent-loader cache is bumped
        run: |
          python - <<'PY'
          from pathlib import Path
          old='velour-v4.4.38-vault-accept-hotfix.js?v=23'
          new='velour-v4.4.38-vault-accept-hotfix.js?v=24'
          for name in ['index.html','scripts/build-github-pages-canonical.mjs']:
              p=Path(name)
              s=p.read_text()
              if old in s:
                  p.write_text(s.replace(old,new))
              elif new not in s:
                  raise SystemExit(f'{name}: neither v23 nor v24 loader marker found')
          PY
      - name: Commit cache bump if needed
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html scripts/build-github-pages-canonical.mjs
          git commit -m "Bust ensemble preference loader cache"
          git push origin HEAD:feat/ensemble-character-preferences-v2
