<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>VELOUR V4.4.38 loading…</title>
  <style>
    html,body{margin:0;min-height:100%;background:#16070e;color:#fff6f8;font-family:-apple-system,BlinkMacSystemFont,"Pretendard",sans-serif}
    .boot{min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;box-sizing:border-box}
    .boot b{display:block;font-size:20px;margin-bottom:8px}.boot span{color:#c9b1bd;font-size:13px;line-height:1.6}
  </style>
</head>
<body>
<div class="boot"><div><b>✦ VELOUR</b><span>개인 인증 스튜디오를 불러오는 중…</span></div></div>
<script>
(async()=>{
  try{
    const SOURCE='https://raw.githubusercontent.com/cozysso-afk/velour-studio/72b2b96a875fa40e98c32228cd93f629f3b1298c/index.html?velour_auth_boot=2';
    const res=await fetch(SOURCE,{cache:'no-store'});
    if(!res.ok) throw new Error('원본 로드 실패: HTTP '+res.status);
    let html=await res.text();
    html=html.replaceAll('velour-v4.4.38-vault-accept-hotfix.js?v=11','velour-v4.4.38-vault-accept-hotfix.js?v=13');
    document.open();
    document.write(html);
    document.close();
  }catch(err){
    document.body.innerHTML='<div class="boot"><div><b>⚠️ VELOUR 로드 실패</b><span>'+String(err?.message||err)+'<br><br>네트워크 연결 후 다시 열어줘.</span></div></div>';
  }
})();
</script>
</body>
</html>
