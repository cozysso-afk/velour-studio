<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>VELOUR V3.3 loading…</title>
  <style>
    html,body{margin:0;min-height:100%;background:#16070e;color:#fff6f8;font-family:-apple-system,BlinkMacSystemFont,"Pretendard",sans-serif}
    .boot{min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;box-sizing:border-box}
    .boot b{display:block;font-size:20px;margin-bottom:8px}.boot span{color:#c9b1bd;font-size:13px;line-height:1.6}
  </style>
</head>
<body>
<div class="boot"><div><b>✦ VELOUR</b><span>재회커플 + 저장함 + Story Engine V3.2를 불러오는 중…</span></div></div>
<script>
(async function bootVelour(){
  const SOURCE = 'https://raw.githubusercontent.com/cozysso-afk/velour-studio/89a8931f8219fe9c3245cfbc0468932def227fe5/index.html';

  const FIX_CSS = String.raw`
<style id="velour-v2-css">
  button,.tag-pill,.icon-btn,.btn-gold,.btn-outline { touch-action:manipulation; }
  .velour-library-modal {
    position:fixed; inset:0; z-index:500; display:none; align-items:center; justify-content:center;
    padding:14px; background:rgba(7,1,4,.94); backdrop-filter:blur(16px);
  }
  .velour-library-modal.show { display:flex; }
  .velour-library-shell {
    width:100%; max-width:440px; max-height:88vh; overflow:hidden; display:flex; flex-direction:column;
    background:#190812; border:1px solid rgba(245,196,107,.30); border-radius:24px;
    box-shadow:0 24px 60px rgba(0,0,0,.72);
  }
  .velour-library-head { padding:17px 16px 12px; border-bottom:1px solid rgba(245,196,107,.16); }
  .velour-library-title { display:flex; justify-content:space-between; align-items:flex-start; gap:8px; }
  .velour-library-title h3 { margin:0; font-family:'Noto Serif KR',serif; font-size:17px; color:#ffebaa; }
  .velour-library-x { background:transparent; border:0; color:#c9b1bd; font-size:24px; padding:0 5px; }
  .velour-lib-tools { display:flex; gap:7px; margin-top:11px; }
  .velour-lib-tools input { flex:1; min-width:0; }
  .velour-small-btn {
    border:1px solid rgba(245,196,107,.25); background:rgba(245,196,107,.08); color:#ffebaa;
    border-radius:10px; padding:8px 10px; font-size:10.5px; font-weight:650; white-space:nowrap;
  }
  .velour-library-list { padding:12px; overflow-y:auto; -webkit-overflow-scrolling:touch; }
  .velour-empty { text-align:center; padding:30px 8px; color:#c9b1bd; font-size:12px; line-height:1.65; }
  .velour-story-card {
    border:1px solid rgba(245,196,107,.18); background:rgba(255,255,255,.035); border-radius:15px;
    padding:12px; margin-bottom:9px;
  }
  .velour-story-top { display:flex; justify-content:space-between; gap:8px; align-items:flex-start; }
  .velour-story-card h4 { margin:0; font-size:13px; color:#fff3d1; line-height:1.4; }
  .velour-story-date { color:#9f8794; font-size:9.5px; white-space:nowrap; }
  .velour-story-meta { margin:7px 0; color:#d6c2cc; font-size:10.5px; line-height:1.55; }
  .velour-story-preview { color:#bca7b2; font:11px/1.7 'Noto Serif KR',serif; max-height:5.1em; overflow:hidden; }
  .velour-story-actions { display:flex; gap:6px; flex-wrap:wrap; margin-top:9px; }
  .velour-story-actions button {
    border:1px solid rgba(245,196,107,.22); background:rgba(245,196,107,.07); color:#ffdf98;
    border-radius:9px; padding:6px 9px; font-size:10px; font-weight:650;
  }
  .velour-story-actions button.danger { color:#ffb7c2; border-color:rgba(255,120,140,.23); background:rgba(255,100,120,.05); }
  .velour-library-count { margin-top:5px; color:#9f8794; font-size:10px; }
  .velour-draft-banner {
    display:none; margin:0 0 12px; padding:10px 12px; border-radius:13px;
    border:1px solid rgba(245,196,107,.22); background:rgba(245,196,107,.08); color:#f9e8c0;
    font-size:11px; line-height:1.45; align-items:center; justify-content:space-between; gap:8px;
  }
  .velour-draft-banner.show { display:flex; }
  .velour-draft-banner button { border:0; border-radius:9px; padding:6px 9px; background:#f5c46b; color:#281406; font-size:10px; font-weight:800; white-space:nowrap; }
  .result-actions-v2 { display:flex; gap:6px; }
  @media(max-width:390px){ .result-actions-v2 .icon-btn{padding:7px 9px;font-size:10px} }
</style>`;

  const LIBRARY_HTML = String.raw`
<div class="velour-library-modal" id="velourLibraryModal" aria-hidden="true">
  <div class="velour-library-shell">
    <div class="velour-library-head">
      <div class="velour-library-title">
        <div><span class="panel-tag" style="margin-bottom:4px;">STORY LIBRARY</span><h3>📚 저장된 스토리</h3></div>
        <button class="velour-library-x" onclick="closeStoryLibrary()">×</button>
      </div>
      <div class="velour-lib-tools">
        <input id="velourStorySearch" type="search" placeholder="제목·인물·관계 검색" oninput="renderStoryLibrary()">
        <button class="velour-small-btn" onclick="copyStoryLibrary()">전체 복사</button>
        <button class="velour-small-btn" onclick="clearStoryLibrary()">비우기</button>
      </div>
      <div class="velour-library-count" id="velourLibraryCount"></div>
    </div>
    <div class="velour-library-list" id="velourLibraryList"></div>
  </div>
</div>`;

  const PATCH_JS = String.raw`
(function installVelourV2(){
  if (window.__VELOUR_V2_INSTALLED__) return;
  window.__VELOUR_V2_INSTALLED__ = true;

  const LIB_KEY = 'VELOUR_STORY_LIBRARY_V2';
  const DRAFT_KEY = 'VELOUR_STORY_DRAFT_V2';
  let sessionEpisodes = [];

  function esc(value){
    return String(value ?? '').replace(/[&<>\"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[ch]));
  }

  function library(){
    try { const data=JSON.parse(localStorage.getItem(LIB_KEY)||'[]'); return Array.isArray(data)?data:[]; }
    catch(e){ return []; }
  }
  function setLibrary(items){
    try { localStorage.setItem(LIB_KEY, JSON.stringify(items.slice(0,60))); }
    catch(e){ alert('저장 공간이 부족해. 오래된 스토리를 일부 지워줘.'); }
  }

  function currentSettings(){
    return {
      genre: document.getElementById('selectGenre')?.value || '',
      stage: document.getElementById('selectStage')?.value || '',
      intensity: document.getElementById('selectIntensity')?.value || '',
      chars: document.getElementById('inputChars')?.value || '',
      plot: document.getElementById('inputPlot')?.value || '',
      tropes: Array.from(document.querySelectorAll('#tropeTags .tag-pill.active')).map(el=>el.innerText)
    };
  }

  function applySettings(settings){
    if(!settings) return;
    const pairs=[['selectGenre','genre'],['selectStage','stage'],['selectIntensity','intensity'],['inputChars','chars'],['inputPlot','plot']];
    pairs.forEach(([id,key])=>{ const el=document.getElementById(id); if(el && settings[key] != null) el.value=settings[key]; });
    const wanted=new Set(settings.tropes||[]);
    document.querySelectorAll('#tropeTags .tag-pill').forEach(el=>el.classList.toggle('active', wanted.has(el.innerText)));
  }

  function addReunionOptions(){
    const tags=document.getElementById('tropeTags');
    if(tags && !Array.from(tags.children).some(el=>el.innerText.includes('재회커플'))){
      const pill=document.createElement('span');
      pill.className='tag-pill';
      pill.textContent='재회커플 · 헤어진 연인 × 다시 시작';
      pill.onclick=function(){ togglePill(this); };
      tags.appendChild(pill);
    }
    const stage=document.getElementById('selectStage');
    if(stage && !Array.from(stage.options).some(opt=>opt.textContent.includes('재회'))){
      const opt=document.createElement('option');
      opt.value='[재회 & 관계 재구축] 헤어진 뒤 남은 미련과 오해를 풀고, 다시 마주한 두 사람이 신뢰와 감정의 경계를 새로 세우는 과정에 집중';
      opt.textContent='04. 재회커플 (미련 / 오해 해소 / 관계 재구축)';
      stage.appendChild(opt);
    }
  }

  function installLibraryButtons(){
    const header=document.querySelector('header');
    const settingsBtn=header?.querySelector('.icon-btn');
    if(header && settingsBtn && !document.getElementById('btnStoryLibrary')){
      const btn=document.createElement('button');
      btn.className='icon-btn'; btn.id='btnStoryLibrary'; btn.textContent='📚 저장함';
      btn.onclick=openStoryLibrary;
      settingsBtn.insertAdjacentElement('beforebegin',btn);
    }

    const resultHeader=document.querySelector('#resultPanel .result-header');
    if(resultHeader && !document.getElementById('btnSaveStory')){
      const oldBtn=resultHeader.querySelector('.icon-btn');
      const wrap=document.createElement('div'); wrap.className='result-actions-v2';
      if(oldBtn){ oldBtn.parentNode.insertBefore(wrap, oldBtn); wrap.appendChild(oldBtn); }
      else resultHeader.appendChild(wrap);
      const save=document.createElement('button');
      save.className='icon-btn'; save.id='btnSaveStory'; save.textContent='💾 저장'; save.onclick=saveCurrentStory;
      wrap.appendChild(save);
    }

    const hero=document.querySelector('.hero-banner');
    if(hero && !document.getElementById('velourDraftBanner')){
      const banner=document.createElement('div');
      banner.id='velourDraftBanner'; banner.className='velour-draft-banner';
      banner.innerHTML='<span>↶ 이전에 생성하던 임시 스토리가 남아 있어.</span><button onclick="restoreDraftStory()">복구</button>';
      hero.insertAdjacentElement('afterend',banner);
    }
  }

  function validGeneratedText(){
    const text=document.getElementById('novelText')?.innerText?.trim() || '';
    if(!text) return '';
    if(text.includes('서사 집필 중') || text.startsWith('[API 오류]') || text.startsWith('[통신 오류]') || text.includes('응답이 생성되지 않았습니다')) return '';
    return text;
  }

  function draftObject(){
    const current=validGeneratedText();
    if(!current && !storyHistory) return null;
    return {
      savedAt:new Date().toISOString(),
      episodeCount:Number(episodeCount||1),
      episodes:sessionEpisodes,
      storyHistory:storyHistory || current,
      currentText:current,
      settings:currentSettings()
    };
  }

  function saveDraft(){
    const draft=draftObject();
    if(!draft) return;
    try { localStorage.setItem(DRAFT_KEY, JSON.stringify(draft)); showDraftBanner(); } catch(e){}
  }

  function showDraftBanner(){
    const banner=document.getElementById('velourDraftBanner');
    if(!banner) return;
    let has=false;
    try { has=!!localStorage.getItem(DRAFT_KEY); } catch(e){}
    banner.classList.toggle('show',has && !validGeneratedText());
  }

  window.restoreDraftStory=function(){
    try {
      const d=JSON.parse(localStorage.getItem(DRAFT_KEY)||'null');
      if(!d) return;
      applySettings(d.settings);
      episodeCount=Number(d.episodeCount||1);
      storyHistory=d.storyHistory||'';
      sessionEpisodes=Array.isArray(d.episodes)?d.episodes:[];
      const panel=document.getElementById('resultPanel');
      const text=document.getElementById('novelText');
      const title=document.getElementById('resultTitle');
      if(panel) panel.style.display='block';
      if(text) text.innerText=d.currentText || (sessionEpisodes.at(-1)?.text) || storyHistory;
      if(title) title.innerText='EPISODE '+String(episodeCount).padStart(2,'0');
      const next=document.getElementById('btnNext'); if(next) next.style.display='block';
      document.getElementById('velourDraftBanner')?.classList.remove('show');
      panel?.scrollIntoView({behavior:'smooth'});
    } catch(e){ alert('임시 스토리를 복구하지 못했어.'); }
  };

  window.saveCurrentStory=function(){
    const d=draftObject();
    if(!d) return alert('저장할 스토리가 아직 없어. 먼저 한 화를 생성해줘.');
    const settings=d.settings;
    const defaultName=(settings.chars?settings.chars.slice(0,28):'VELOUR Story')+' · '+new Date().toLocaleDateString('ko-KR');
    const title=prompt('저장할 작품 제목',defaultName);
    if(title===null) return;
    const item={
      id:crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random().toString(16).slice(2),
      title:(title.trim()||defaultName),
      date:new Date().toLocaleString('ko-KR'),
      ...d
    };
    const items=library(); items.unshift(item); setLibrary(items);
    alert('💾 현재 설정과 스토리 전체를 저장했어. 이어쓰기 상태도 같이 보관돼.');
  };

  window.openStoryLibrary=function(){
    const modal=document.getElementById('velourLibraryModal');
    if(!modal) return;
    modal.classList.add('show'); modal.setAttribute('aria-hidden','false'); renderStoryLibrary();
  };
  window.closeStoryLibrary=function(){
    const modal=document.getElementById('velourLibraryModal'); if(!modal)return;
    modal.classList.remove('show'); modal.setAttribute('aria-hidden','true');
  };

  window.renderStoryLibrary=function(){
    const list=document.getElementById('velourLibraryList'); if(!list)return;
    const search=(document.getElementById('velourStorySearch')?.value||'').trim().toLowerCase();
    const items=library();
    const filtered=items.filter(item=>{
      const s=item.settings||{};
      return !search || [item.title,s.chars,s.plot,(s.tropes||[]).join(' '),item.storyHistory].join(' ').toLowerCase().includes(search);
    });
    const count=document.getElementById('velourLibraryCount');
    if(count) count.textContent='저장 '+items.length+'개'+(search?' · 검색 결과 '+filtered.length+'개':'');
    if(!filtered.length){ list.innerHTML='<div class="velour-empty">'+(items.length?'검색 결과가 없어.':'저장된 스토리가 아직 없어.<br>생성 결과의 💾 저장 버튼을 눌러줘.')+'</div>'; return; }
    list.innerHTML=filtered.map(item=>{
      const s=item.settings||{};
      const preview=(item.currentText || item.storyHistory || '').slice(0,240);
      return '<article class="velour-story-card">'+
        '<div class="velour-story-top"><h4>'+esc(item.title||'VELOUR Story')+'</h4><span class="velour-story-date">'+esc(item.date||'')+'</span></div>'+
        '<div class="velour-story-meta">'+esc(s.chars||'인물 설정 없음')+'<br>'+esc((s.tropes||[]).join(' · '))+'<br>EP '+esc(item.episodeCount||1)+'</div>'+
        '<div class="velour-story-preview">'+esc(preview)+(preview.length>=240?'…':'')+'</div>'+
        '<div class="velour-story-actions"><button onclick="restoreStory(\''+item.id+'\')">이어쓰기 복구</button><button onclick="copyStory(\''+item.id+'\')">전체 복사</button><button class="danger" onclick="deleteStory(\''+item.id+'\')">삭제</button></div>'+
        '</article>';
    }).join('');
  };

  window.restoreStory=function(id){
    const item=library().find(x=>String(x.id)===String(id)); if(!item)return;
    applySettings(item.settings);
    episodeCount=Number(item.episodeCount||1);
    storyHistory=item.storyHistory||'';
    sessionEpisodes=Array.isArray(item.episodes)?item.episodes:[];
    const panel=document.getElementById('resultPanel'); const text=document.getElementById('novelText'); const title=document.getElementById('resultTitle');
    if(panel) panel.style.display='block';
    if(text) text.innerText=item.currentText || sessionEpisodes.at(-1)?.text || storyHistory;
    if(title) title.innerText='EPISODE '+String(episodeCount).padStart(2,'0');
    const next=document.getElementById('btnNext'); if(next) next.style.display='block';
    closeStoryLibrary(); saveDraft(); panel?.scrollIntoView({behavior:'smooth'});
  };

  window.copyStory=function(id){
    const item=library().find(x=>String(x.id)===String(id)); if(!item)return;
    const body=(item.episodes&&item.episodes.length)?item.episodes.map(ep=>'[EPISODE '+String(ep.episode).padStart(2,'0')+']\n'+ep.text).join('\n\n'):item.storyHistory;
    navigator.clipboard.writeText((item.title||'VELOUR Story')+'\n\n'+body).then(()=>alert('📋 작품 전체를 복사했어.'));
  };

  window.copyStoryLibrary=function(){
    const items=library(); if(!items.length)return alert('복사할 스토리가 없어.');
    const text=items.map(item=>'['+(item.title||'VELOUR Story')+']\n'+(item.storyHistory||'')).join('\n\n══════════\n\n');
    navigator.clipboard.writeText(text).then(()=>alert('📋 저장함 전체를 복사했어.'));
  };

  window.deleteStory=function(id){
    const items=library(); if(!confirm('이 스토리를 삭제할까?'))return;
    setLibrary(items.filter(x=>String(x.id)!==String(id))); renderStoryLibrary();
  };
  window.clearStoryLibrary=function(){
    if(!library().length)return; if(!confirm('저장된 스토리를 전부 삭제할까? 되돌릴 수 없어.'))return;
    setLibrary([]); renderStoryLibrary();
  };

  const originalGenerate=window.generateStory;
  if(typeof originalGenerate==='function'){
    window.generateStory=async function(isContinue=false){
      if(!isContinue) sessionEpisodes=[];
      await originalGenerate(isContinue);
      const generated=validGeneratedText();
      if(generated){
        const epNo=Number(episodeCount||1);
        const existing=sessionEpisodes.findIndex(ep=>ep.episode===epNo);
        const row={episode:epNo,text:generated};
        if(existing>=0) sessionEpisodes[existing]=row; else sessionEpisodes.push(row);
        saveDraft();
      }
    };
  }

  addReunionOptions();
  installLibraryButtons();
  showDraftBanner();
  document.addEventListener('click',e=>{ const modal=document.getElementById('velourLibraryModal'); if(modal&&e.target===modal)closeStoryLibrary(); });
})();`;

  try {
    const res = await fetch(SOURCE, { cache: 'no-store' });
    if (!res.ok) throw new Error('원본 로드 실패: HTTP ' + res.status);
    let html = await res.text();
    html = html.replace('</head>', FIX_CSS + '\n</head>');
    html = html.replace('</body>', LIBRARY_HTML + '\n<script>' + PATCH_JS + '<' + '/script>\n<script src="./velour-v3.3.js?v=33"><' + '/script>\n</body>');
    document.open(); document.write(html); document.close();
  } catch(err) {
    document.body.innerHTML='<div class="boot"><div><b>⚠️ VELOUR 로드 실패</b><span>'+String(err.message||err)+'<br><br>네트워크 연결 후 다시 열어줘.</span></div></div>';
  }
})();
</script>
</body>
</html>
