  function randomMix(){
    document.querySelectorAll('.v3-chip').forEach(x=>x.classList.remove('active'));

    const picks=[];
    while(picks.length<3 && groups.length){
      const gi=Math.floor(Math.random()*groups.length);
      const arr=groups.splice(gi,1)[0];
      picks.push(arr[Math.floor(Math.random()*arr.length)]);
    }
    const set=new Set(picks);
    document.querySelectorAll('.v3-chip').forEach(x=>x.classList.toggle('active',set.has(x.dataset.concept)));

  // -------- Story Director: replaces original prompt logic --------
  const originalBuildPrompt=window.buildPrompt;
  window.buildPrompt=function(isContinue=false){
    const genre=$('selectGenre')?.value||'현대 로맨스';
    const stage=$('selectStage')?.value||'';
    const intensity=$('selectIntensity')?.value||'';
    const tropes=[...document.querySelectorAll('#tropeTags .tag-pill.active')].map(e=>e.innerText);
    const concepts=activeConcepts();
    const chars=$('inputChars')?.value.trim()||'서로 다른 방식으로 강한 매력을 지닌 두 성인 주연';
    const userPlot=$('inputPlot')?.value.trim()||'';

    const defaults=\`여주인공은 성인이며 풍만하고 균형 잡힌 곡선, 볼륨감 있는 가슴, 가는 허리, 둥글고 탄탄한 힙, 밝고 깨끗한 피부 톤의 매력을 가진다. 남주인공은 성인이며 큰 체격, 넓은 어깨, 강한 피지컬을 가진다. 둘의 대화에는 도발적 플러팅과 날카로운 티키타카가 자연스럽게 섞인다.\`;
    const plotRule = !isContinue
      ? (userPlot?\`첫 화의 출발점으로만 사용: \${userPlot}\`:\`사용자 발단 입력 없음. 선택한 장르·관계·컨셉에서 자연스러운 첫 사건을 스스로 발명한다.\`)
      : \`사용자가 처음 적은 발단을 다시 반복하지 않는다. 이전 에피소드에서 남은 미해결 감정·약속·오해·비밀 중 하나를 골라 새로운 사건과 장소로 진전시킨다.\`;

    let previous='';
    if(isContinue&&storyHistory){
      const recent=sessionEpisodes.slice(-3).map(x=>\`[EP \${x.episode}]\\n\${x.text}\`).join('\\n\\n');
      previous=(recent||storyHistory.slice(-7000));
    }

    return \`당신은 성인 로맨스 웹소설의 장기 연재에 능숙한 스토리 디렉터이자 소설가다.
목표는 한 화 안에 모든 것을 소진하지 않고, 여러 에피소드에 걸쳐 감정과 긴장을 축적하면서 매 화 사건을 실제로 전진시키는 것이다.

[기본 전제]
- 등장인물은 모두 성인이다.
- 모든 로맨틱/신체적 접촉은 자발적이고 상호 동의가 분명한 상황으로 구성한다.
- 권력관계, 직업, 계약, 빚, 치료, 교육 같은 요소가 있어도 감정선과 관계 서사 자체는 적극적으로 활용한다.
- 의료·치료·재활·연구 소재는 전문적 경계, 돌봄, 신뢰, 취약성, 회복 과정의 긴장감을 충분히 묘사한다. 치료나 처방 자체를 성적 대가·협박으로 사용하지 않는다.
- 성적 행위나 성기 묘사는 노골적으로 쓰지 않는다. 키스·포옹·체온·호흡·손끝의 긴장까지는 밀도 있게 쓰고 그 이후는 페이드아웃한다.

[작품 설정]
- 장르/세계: \${genre}
- 기존 관계성: \${tropes.join(', ')||'강한 상호 긴장'}
- 추가 크로스오버 컨셉: \${concepts.join(' × ')||'없음'}
- 인물: \${chars}
- 외형 기본 프리셋: \${defaults}
- 현재 화: EPISODE \${String(ep).padStart(2,'0')}
- 진행 모드: \${pacingLabel()}
- 이번 화 비트: \${episodeBeat(ep)}
- 현재 단계 UI: \${stage}
- 문체: \${intensity}
- 발단 처리: \${plotRule}

[자동 스토리 디렉터]
\${auto?\`ON. 사용자가 추가 상황을 쓰지 않아도 다음 사건을 스스로 만든다.
1) 직전 화와 다른 장소/시간/행동 중 최소 하나를 새로 사용한다.
2) 직전 화의 핵심 대화나 행동을 변형 반복하지 않는다.
3) 매 화 관계 변수 하나를 실제로 바꾼다: 신뢰, 질투, 비밀, 거리감, 오해, 소유욕, 동맹, 약속 중 하나.
4) 선택된 컨셉이 여러 개면 한꺼번에 나열하지 말고 A가 원인, B가 장소/상황, C가 반전처럼 자연스럽게 결합한다.
5) 새 조연이나 외부 사건은 관계 긴장을 밀어올리는 기능이 있을 때만 추가한다.
6) 끝은 매번 '성적 직전 상황'으로 끝내지 말고, 질문/발각/약속/질투/새 임무/뜻밖의 돌봄/정체 단서 등 다양한 훅을 사용한다.\`:\`OFF. 사용자가 적은 상황을 중심으로 전개하되 동일 문장·행동 반복은 피한다.\`}

[반복 방지]
- 같은 장소에서 같은 대화 → 같은 접촉 → 같은 cliffhanger 구조를 연속 사용하지 않는다.
- 이전 화에서 이미 일어난 사건을 다시 '처음 일어난 일'처럼 쓰지 않는다.
- 관계가 진전되었다면 다음 화에서 그 사실을 기억하고 행동의 기준선도 함께 이동한다.
- 첫 발단은 EP1 이후 '설정'으로만 기억하고 매번 재현하지 않는다.
- 각 화에는 최소 하나의 새로운 정보 또는 선택이 있어야 한다.

[서술]
