  const PATCH_JS = String.raw`
(function installVelourV2(){
  if (window.__VELOUR_V2_INSTALLED__) return;
  window.__VELOUR_V2_INSTALLED__ = true;

  const LIB_KEY = 'VELOUR_STORY_LIBRARY_V2';
  const LIB_BACKUP_KEYS = ['VELOUR_STORY_LIBRARY_V2_BACKUP_1','VELOUR_STORY_LIBRARY_V2_BACKUP_2','VELOUR_STORY_LIBRARY_V2_BACKUP_3'];
  const DRAFT_KEY = 'VELOUR_STORY_DRAFT_V2';
  let sessionEpisodes = [];
  let activeStoryId = null;
  let activeStoryTitle = '';


  function esc(value){
    return String(value ?? '').replace(/[&<>\"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[ch]));
  }

  function parseStoryArray(raw){
    if(!raw) return null;
    try { const data=JSON.parse(raw); return Array.isArray(data)?data:null; }
    catch(e){ return null; }
  }
  function looksLikeStory(item){
    return !!(item && typeof item==='object' && (
      (typeof item.storyHistory==='string' && item.storyHistory.trim()) ||
      (typeof item.currentText==='string' && item.currentText.trim()) ||
      (Array.isArray(item.episodes) && item.episodes.some(ep=>ep && typeof ep.text==='string' && ep.text.trim()))
    ));
  }
  function library(){
    const raw=localStorage.getItem(LIB_KEY);
    const data=parseStoryArray(raw);
    if(data) return data;
    // 파싱 실패를 '삭제됨'으로 위장하지 않는다. 백업이 있으면 읽기 전용으로 보여준다.
    for(const key of LIB_BACKUP_KEYS){
      const backup=parseStoryArray(localStorage.getItem(key));
      if(backup && backup.length) return backup;
    }
    return [];
  }
  function rotateLibraryBackups(){
    try{
      const currentRaw=localStorage.getItem(LIB_KEY);
      const current=parseStoryArray(currentRaw);
      if(!current || !current.length) return;
      const b2=localStorage.getItem(LIB_BACKUP_KEYS[1]);
      const b1=localStorage.getItem(LIB_BACKUP_KEYS[0]);
      if(b2) localStorage.setItem(LIB_BACKUP_KEYS[2],b2);
      if(b1) localStorage.setItem(LIB_BACKUP_KEYS[1],b1);
      localStorage.setItem(LIB_BACKUP_KEYS[0],currentRaw);
    }catch(e){}
  }
  function setLibrary(items){
    try {
      rotateLibraryBackups();
      localStorage.setItem(LIB_KEY, JSON.stringify(items));
    }
    catch(e){ alert('저장 공간이 부족해. 오래된 스토리를 일부 지워줘.'); }
  }
  function storyFingerprint(item){
    return String(item?.id || '')+'|'+String(item?.title||'')+'|'+String(item?.storyHistory||item?.currentText||'').slice(0,160);
  }
  function scanRecoverableStories(){
    const found=[]; const sources=[]; const sourceCounts={};
    function addStory(item,source){
      if(!looksLikeStory(item)) return;
      found.push(item);
      sourceCounts[source]=(sourceCounts[source]||0)+1;
    }
    function walk(value,source,depth){
      if(depth>3 || value==null) return;
      if(Array.isArray(value)){
        const stories=value.filter(looksLikeStory);
        if(stories.length){ stories.forEach(x=>addStory(x,source)); return; }
        value.slice(0,80).forEach(v=>walk(v,source,depth+1));
        return;
      }
      if(typeof value==='object'){
        if(looksLikeStory(value)){ addStory(value,source); return; }
        for(const [k,v] of Object.entries(value)){
          if(['library','stories','savedStories','items','data','backup'].includes(k) || Array.isArray(v)) walk(v,source+'>'+k,depth+1);
        }
      }
    }
    for(let i=0;i<localStorage.length;i++){
      const key=localStorage.key(i); if(!key) continue;
      let raw=''; try{raw=localStorage.getItem(key)||'';}catch(e){continue;}
      if(!raw) continue;
      try{ walk(JSON.parse(raw),key,0); }catch(e){}
    }
    try{
      const draft=JSON.parse(localStorage.getItem(DRAFT_KEY)||'null');
      if(draft && looksLikeStory(draft)){
        addStory({
          id:'recovered-draft-'+Date.now(),
          title:'복구된 임시 스토리 · '+new Date().toLocaleDateString('ko-KR'),
          date:new Date().toLocaleString('ko-KR'),
          settings:draft.settings||{}, episodeCount:draft.episodeCount||1,
          storyHistory:draft.storyHistory||'', currentText:draft.currentText||'', episodes:draft.episodes||[],
          v4State:draft.v4State||null
        }, DRAFT_KEY+'(임시저장)');
      }
    }catch(e){}
    Object.entries(sourceCounts).forEach(([k,n])=>sources.push(k+' ('+n+')'));
    return {items:found,sources};
  }
  function storyIdentity(item){
    if(item?.id) return 'id:'+String(item.id);
    return 'fp:'+String(item?.title||'')+'|'+String(item?.date||'')+'|'+String(item?.storyHistory||item?.currentText||'').slice(0,220);
  }
  function dedupeStories(items){
    const out=[]; const seen=new Set();
    for(const item of items){
      if(!looksLikeStory(item)) continue;
      const id=storyIdentity(item);
      if(seen.has(id)) continue;
      seen.add(id); out.push(item);
    }
    return out;
  }
  function velourStorageSummary(){
    const rows=[];
    for(let i=0;i<localStorage.length;i++){
      const key=localStorage.key(i); if(!key || !key.includes('VELOUR')) continue;
      const raw=localStorage.getItem(key)||'';
      let count='';
      try{
        const parsed=JSON.parse(raw);
        if(Array.isArray(parsed)) count=' · 배열 '+parsed.length+'개';
        else if(parsed && typeof parsed==='object') count=' · 객체';
      }catch(e){ count=' · JSON 파싱 실패'; }
      rows.push(key+' · '+raw.length.toLocaleString()+'자'+count);
    }
    return rows;
  }
  function currentSettings(){
    return {
      genre: document.getElementById('selectGenre')?.value || '',
      stage: document.getElementById('selectStage')?.value || '',
      intensity: document.getElementById('selectIntensity')?.value || '',
      chars: document.getElementById('inputChars')?.value || '',
      plot: document.getElementById('inputPlot')?.value || '',
      tropes: Array.from(document.querySelectorAll('#tropeTags .tag-pill.active')).map(el=>el.innerText)
    };
  }

  function applySettings(settings){
    if(!settings) return;
    const pairs=[['selectGenre','genre'],['selectStage','stage'],['selectIntensity','intensity'],['inputChars','chars'],['inputPlot','plot']];
    pairs.forEach(([id,key])=>{ const el=document.getElementById(id); if(el && settings[key] != null) el.value=settings[key]; });
    const wanted=new Set(settings.tropes||[]);
    document.querySelectorAll('#tropeTags .tag-pill').forEach(el=>el.classList.toggle('active', wanted.has(el.innerText)));
  }

  function addReunionOptions(){
    const tags=document.getElementById('tropeTags');
    if(tags && !Array.from(tags.children).some(el=>el.innerText.includes('재회커플'))){
      const pill=document.createElement('span');
      pill.className='tag-pill';
      pill.textContent='재회커플 · 헤어진 연인 × 다시 시작';
      pill.onclick=function(){ togglePill(this); };
      tags.appendChild(pill);
    }
    const stage=document.getElementById('selectStage');
    if(stage && !Array.from(stage.options).some(opt=>opt.textContent.includes('재회'))){
      const opt=document.createElement('option');
      opt.value='[재회 & 관계 재구축] 헤어진 뒤 남은 미련과 오해를 풀고, 다시 마주한 두 사람이 신뢰와 감정의 경계를 새로 세우는 과정에 집중';
      opt.textContent='04. 재회커플 (미련 / 오해 해소 / 관계 재구축)';
      stage.appendChild(opt);
    }
  }

  function installLibraryButtons(){
    const header=document.querySelector('header');
    const settingsBtn=header?.querySelector('.icon-btn');
    if(header && settingsBtn && !document.getElementById('btnStoryLibrary')){
      const btn=document.createElement('button');
      btn.className='icon-btn'; btn.id='btnStoryLibrary'; btn.textContent='📚 저장함';
      btn.onclick=openStoryLibrary;
      settingsBtn.insertAdjacentElement('beforebegin',btn);
    }

    const resultHeader=document.querySelector('#resultPanel .result-header');
    if(resultHeader && !document.getElementById('btnSaveStory')){
      const oldBtn=resultHeader.querySelector('.icon-btn');
      const wrap=document.createElement('div'); wrap.className='result-actions-v2';
      if(oldBtn){ oldBtn.parentNode.insertBefore(wrap, oldBtn); wrap.appendChild(oldBtn); }
      else resultHeader.appendChild(wrap);
      const save=document.createElement('button');
      save.className='icon-btn'; save.id='btnSaveStory'; save.textContent='💾 저장'; save.onclick=()=>window.saveCurrentStory();
      wrap.appendChild(save);
    }

    const hero=document.querySelector('.hero-banner');
    if(hero && !document.getElementById('velourDraftBanner')){
      const banner=document.createElement('div');
      banner.id='velourDraftBanner'; banner.className='velour-draft-banner';
      banner.innerHTML='<span>↶ 이전에 생성하던 임시 스토리가 남아 있어.</span><button onclick="restoreDraftStory()">복구</button>';
      hero.insertAdjacentElement('afterend',banner);
    }
  }

  function looksLikeModelRefusal(text){
    const t=String(text||'').trim();
    if(!t || t.length>1600) return false;
    const refusal=/(진행할 수 없(?:습니다|어요)?|생성(?:이)? 불가능|생성할 수 없(?:습니다|어요)?|작성할 수 없(?:습니다|어요)?|제공할 수 없(?:습니다|어요)?|도와드릴 수 없(?:습니다|어요)?|지원하지 않(?:습니다|아요)?|지원할 수 없(?:습니다|어요)?|허용되지 않(?:습니다|아요)?|요청을 수행할 수 없(?:습니다|어요)?|응답할 수 없(?:습니다|어요)?|I (?:can(?:not|'t)|am unable to) (?:help|assist|provide|generate|write))/i;
    const context=/(성적|노골적|신체 부위|콘텐츠|지침|정책|sexual|explicit|policy|guideline)/i;
    return refusal.test(t)&&context.test(t);
  }

  function validGeneratedText(){
    const text=document.getElementById('novelText')?.innerText?.trim() || '';
    if(!text) return '';
    if(text.includes('서사 집필 중') || text.startsWith('[API 오류]') || text.startsWith('[통신 오류]') || text.includes('응답이 생성되지 않았습니다') || looksLikeModelRefusal(text)) return '';
    return text;
  }

  function draftObject(){
    const current=validGeneratedText();
    if(!current && !storyHistory) return null;
    return {
      savedAt:new Date().toISOString(),
      episodeCount:Number(episodeCount||1),
      episodes:sessionEpisodes,
      storyHistory:storyHistory || current,
      currentText:current,
      settings:currentSettings(),
      activeStoryId:activeStoryId || null,
      activeStoryTitle:activeStoryTitle || ''
    };
  }

  function saveDraft(){
    const draft=draftObject();
    if(!draft) return;
    try {
      if(typeof window.__VELOUR_IDB_SAVE_DRAFT__==='function'){
        Promise.resolve(window.__VELOUR_IDB_SAVE_DRAFT__(draft)).catch(()=>{});
        return;
      }
      localStorage.setItem(DRAFT_KEY, JSON.stringify(draft)); showDraftBanner();
    } catch(e){}
  }

  function showDraftBanner(){
    const banner=document.getElementById('velourDraftBanner');
    if(!banner) return;
    let has=false;
    try { has=!!localStorage.getItem(DRAFT_KEY); } catch(e){}
    banner.classList.toggle('show',has && !validGeneratedText());
  }

  window.restoreDraftStory=function(){
    try {
      const d=JSON.parse(localStorage.getItem(DRAFT_KEY)||'null');
      if(!d) return;
      applySettings(d.settings);
      episodeCount=Number(d.episodeCount||1);
      storyHistory=d.storyHistory||'';
      sessionEpisodes=Array.isArray(d.episodes)?d.episodes:[];
      activeStoryId=d.activeStoryId || null;
      activeStoryTitle=d.activeStoryTitle || '';
      if(activeStoryId && !library().some(x=>String(x.id)===String(activeStoryId))){ activeStoryId=null; activeStoryTitle=''; }
      updateSaveButtonLabel();
      const panel=document.getElementById('resultPanel');
      const text=document.getElementById('novelText');
      const title=document.getElementById('resultTitle');
      if(panel) panel.style.display='block';
      if(text) text.innerText=d.currentText || (sessionEpisodes.at(-1)?.text) || storyHistory;
      if(title) title.innerText='EPISODE '+String(episodeCount).padStart(2,'0');
      const next=document.getElementById('btnNext'); if(next) next.style.display='block';
      document.getElementById('velourDraftBanner')?.classList.remove('show');
      panel?.scrollIntoView({behavior:'smooth'});
    } catch(e){ alert('임시 스토리를 복구하지 못했어.'); }
  };

  function updateSaveButtonLabel(){
    const btn=document.getElementById('btnSaveStory');
    if(!btn) return;
    const linked=activeStoryId && library().some(x=>String(x.id)===String(activeStoryId));
    btn.textContent=linked?'💾 이어 저장':'💾 저장';
    btn.title=linked?(activeStoryTitle?('현재 작품 업데이트: '+activeStoryTitle):'현재 저장 작품 업데이트'):'새 저장 슬롯 만들기';
  }

  function writeLinkedStory(d){
    if(!activeStoryId) return false;
    const items=library();
    const i=items.findIndex(x=>String(x.id)===String(activeStoryId));
    if(i<0){ activeStoryId=null; activeStoryTitle=''; updateSaveButtonLabel(); return false; }
    const old=items[i];
    const updated={
      ...old,
      ...d,
      id:old.id,
      title:old.title || activeStoryTitle || 'VELOUR Story',
      createdAt:old.createdAt || old.savedAt || old.date || '',
      date:new Date().toLocaleString('ko-KR'),
      updatedAt:new Date().toISOString(),
      activeStoryId:old.id,
      activeStoryTitle:old.title || activeStoryTitle || 'VELOUR Story'
    };
    items[i]=updated;
    setLibrary(items);
    activeStoryTitle=updated.title;
    saveDraft();
    updateSaveButtonLabel();
    return true;
  }

  window.saveCurrentStory=function(){
    const d=draftObject();
    if(!d) return alert('저장할 스토리가 아직 없어. 먼저 한 화를 생성해줘.');

    if(writeLinkedStory(d)){
      alert('💾 이어 저장 완료! 기존 작품 슬롯에 최신 EP·본문·설정·장기메모리를 업데이트했어.');
      return;
    }

    const settings=d.settings;
    const defaultName=(settings.chars?settings.chars.slice(0,28):'VELOUR Story')+' · '+new Date().toLocaleDateString('ko-KR');
    const title=prompt('처음 한 번만 작품 제목을 정해줘',defaultName);
    if(title===null) return;
    const id=crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random().toString(16).slice(2);
    const finalTitle=(title.trim()||defaultName);
    const item={
      id,
      title:finalTitle,
      date:new Date().toLocaleString('ko-KR'),
      createdAt:new Date().toISOString(),
      updatedAt:new Date().toISOString(),
      ...d,
      activeStoryId:id,
      activeStoryTitle:finalTitle
    };
    const items=library(); items.unshift(item); setLibrary(items);
    activeStoryId=id; activeStoryTitle=finalTitle;
    saveDraft();
    updateSaveButtonLabel();
    alert('💾 새 작품으로 저장했어. 다음부터는 [이어 저장]을 누르면 같은 슬롯에 업데이트돼.');
  };

  window.saveCurrentStoryAsNew=function(){
    const previousId=activeStoryId, previousTitle=activeStoryTitle;
    activeStoryId=null; activeStoryTitle='';
    updateSaveButtonLabel();
    window.saveCurrentStory();
    if(!activeStoryId){ activeStoryId=previousId; activeStoryTitle=previousTitle; updateSaveButtonLabel(); }
  };

  window.openStoryLibrary=function(){
    const modal=document.getElementById('velourLibraryModal');
    if(!modal) return;
    modal.classList.add('show'); modal.setAttribute('aria-hidden','false'); renderStoryLibrary();
  };
  window.closeStoryLibrary=function(){
    const modal=document.getElementById('velourLibraryModal'); if(!modal)return;
    modal.classList.remove('show'); modal.setAttribute('aria-hidden','true');
  };

  window.renderStoryLibrary=function(){
    const list=document.getElementById('velourLibraryList'); if(!list)return;
    const search=(document.getElementById('velourStorySearch')?.value||'').trim().toLowerCase();
    const items=library();
    const filtered=items.filter(item=>{
      const s=item.settings||{};
      return !search || [item.title,s.chars,s.plot,(s.tropes||[]).join(' '),item.storyHistory].join(' ').toLowerCase().includes(search);
    });
    const count=document.getElementById('velourLibraryCount');
    if(count) count.textContent='저장 '+items.length+'개'+(search?' · 검색 결과 '+filtered.length+'개':'');
    if(!filtered.length){ list.innerHTML='<div class="velour-empty">'+(items.length?'검색 결과가 없어.':'저장된 스토리가 아직 없어.<br>생성 결과의 💾 저장 버튼을 눌러줘.')+'</div>'; return; }
    list.innerHTML=filtered.map(item=>{
      const s=item.settings||{};
      const preview=(item.currentText || item.storyHistory || '').slice(0,240);
      return '<article class="velour-story-card">'+
        '<div class="velour-story-top"><h4>'+esc(item.title||'VELOUR Story')+(String(item.id)===String(activeStoryId)?' <small style="color:#f5c46b;font-size:9px">● 이어쓰는 중</small>':'')+'</h4><span class="velour-story-date">'+esc(item.date||'')+'</span></div>'+
        '<div class="velour-story-meta">'+esc(s.chars||'인물 설정 없음')+'<br>'+esc((s.tropes||[]).join(' · '))+'<br>EP '+esc(item.episodeCount||1)+'</div>'+
        '<div class="velour-story-preview">'+esc(preview)+(preview.length>=240?'…':'')+'</div>'+
        '<div class="velour-story-actions"><button onclick="restoreStory(\''+item.id+'\')">이어쓰기 복구</button><button onclick="copyStory(\''+item.id+'\')">전체 복사</button><button class="danger" onclick="deleteStory(\''+item.id+'\')">삭제</button></div>'+
        '</article>';
    }).join('');
  };

  window.restoreStory=function(id){
    const item=library().find(x=>String(x.id)===String(id)); if(!item)return;
    applySettings(item.settings);
    episodeCount=Number(item.episodeCount||1);
    storyHistory=item.storyHistory||'';
    sessionEpisodes=Array.isArray(item.episodes)?item.episodes:[];
    activeStoryId=item.id;
    activeStoryTitle=item.title||'VELOUR Story';
    updateSaveButtonLabel();
    const panel=document.getElementById('resultPanel'); const text=document.getElementById('novelText'); const title=document.getElementById('resultTitle');
    if(panel) panel.style.display='block';
    if(text) text.innerText=item.currentText || sessionEpisodes.at(-1)?.text || storyHistory;
    if(title) title.innerText='EPISODE '+String(episodeCount).padStart(2,'0');
    const next=document.getElementById('btnNext'); if(next) next.style.display='block';
    closeStoryLibrary(); saveDraft(); panel?.scrollIntoView({behavior:'smooth'});
  };

  window.copyStory=function(id){
    const item=library().find(x=>String(x.id)===String(id)); if(!item)return;
    const body=(item.episodes&&item.episodes.length)?item.episodes.map(ep=>'[EPISODE '+String(ep.episode).padStart(2,'0')+']\n'+ep.text).join('\n\n'):item.storyHistory;
    navigator.clipboard.writeText((item.title||'VELOUR Story')+'\n\n'+body).then(()=>alert('📋 작품 전체를 복사했어.'));
  };

  window.copyStoryLibrary=function(){
    const items=library(); if(!items.length)return alert('복사할 스토리가 없어.');
    const text=items.map(item=>'['+(item.title||'VELOUR Story')+']\n'+(item.storyHistory||'')).join('\n\n══════════\n\n');
    navigator.clipboard.writeText(text).then(()=>alert('📋 저장함 전체를 복사했어.'));
  };

  window.diagnoseStoryLibrary=function(){
    const primary=parseStoryArray(localStorage.getItem(LIB_KEY)||'')||[];
    const scan=scanRecoverableStories();
    const existingIds=new Set(primary.map(storyIdentity));
    const candidates=dedupeStories(scan.items).filter(x=>!existingIds.has(storyIdentity(x)));
    const lines=[
      '현재 메인 저장함: '+primary.length+'개',
      '다른 위치의 추가 복구 후보: '+candidates.length+'개',
      '',
      '스캔 출처: '+(scan.sources.join(', ')||'없음'),
      '',
      '남아 있는 VELOUR 저장 키:',
      ...(velourStorageSummary().length?velourStorageSummary():['없음'])
    ];
    alert(lines.join('\n'));
  };

  window.recoverStoryLibrary=function(){
    const primaryRaw=localStorage.getItem(LIB_KEY)||'';
    const primary=parseStoryArray(primaryRaw)||[];
    const scan=scanRecoverableStories();
    const existingIds=new Set(primary.map(storyIdentity));
    const candidates=dedupeStories(scan.items).filter(x=>!existingIds.has(storyIdentity(x)));

    if(!candidates.length){
      const rows=velourStorageSummary();
      alert('현재 메인 저장함 '+primary.length+'개는 그대로 남아 있어.\n하지만 다른 저장 위치에서 추가 작품 후보는 찾지 못했어.\n\n남아 있는 VELOUR 키:\n'+(rows.join('\n')||'없음')+'\n\n이 상태에서는 새 저장/비우기를 하지 말고 이 창을 캡처해서 보여줘.');
      renderStoryLibrary(); return;
    }

    const candidateSummary=candidates.slice(0,12).map((x,i)=>(i+1)+'. '+(x.title||'제목 없음')+' · '+(x.date||'날짜 없음')+' · EP '+(x.episodeCount||'?')).join('\n');
    const ok=confirm('현재 저장함 '+primary.length+'개는 유지하고, 다른 저장 흔적에서 추가 후보 '+candidates.length+'개를 찾았어.\n\n'+candidateSummary+(candidates.length>12?'\n…외 '+(candidates.length-12)+'개':'')+'\n\n이 후보들만 기존 저장함에 병합 복구할까?');
    if(!ok) return;
    try{
      const stamp=Date.now();
      if(primaryRaw) localStorage.setItem('VELOUR_STORY_LIBRARY_V2_PRE_RESCUE_'+stamp,primaryRaw);
      const merged=dedupeStories([...primary,...candidates]);
      localStorage.setItem(LIB_KEY,JSON.stringify(merged));
      localStorage.setItem(LIB_BACKUP_KEYS[0],JSON.stringify(merged));
      alert('🛟 기존 '+primary.length+'개를 보존한 채 총 '+merged.length+'개로 병합 복구했어.');
      renderStoryLibrary();
    }catch(e){ alert('복구 저장 중 오류: '+String(e.message||e)); }
  };

  window.deleteStory=function(id){
    const items=library(); if(!confirm('이 스토리를 삭제할까?'))return;
    setLibrary(items.filter(x=>String(x.id)!==String(id)));
    if(String(activeStoryId)===String(id)){ activeStoryId=null; activeStoryTitle=''; updateSaveButtonLabel(); }
    renderStoryLibrary();
  };
  window.clearStoryLibrary=function(){
    if(!library().length)return; if(!confirm('저장된 스토리를 전부 삭제할까? 되돌릴 수 없어.'))return;
    setLibrary([]); activeStoryId=null; activeStoryTitle=''; updateSaveButtonLabel(); renderStoryLibrary();
  };

  const originalGenerate=window.generateStory;
  if(typeof originalGenerate==='function'){
    window.generateStory=async function(isContinue=false){
      if(!isContinue){ sessionEpisodes=[]; activeStoryId=null; activeStoryTitle=''; updateSaveButtonLabel(); }
      await originalGenerate(isContinue);
      const generated=validGeneratedText();
      if(generated){
        const epNo=Number(episodeCount||1);
        const existing=sessionEpisodes.findIndex(ep=>ep.episode===epNo);
        const row={episode:epNo,text:generated};
        if(existing>=0) sessionEpisodes[existing]=row; else sessionEpisodes.push(row);
        saveDraft();
      }
    };
  }

  try{
    const raw=localStorage.getItem(LIB_KEY);
    const arr=parseStoryArray(raw);
    if(arr && arr.length && !localStorage.getItem(LIB_BACKUP_KEYS[0])) localStorage.setItem(LIB_BACKUP_KEYS[0],raw);
  }catch(e){}
  addReunionOptions();
  installLibraryButtons();
  updateSaveButtonLabel();
  showDraftBanner();
  document.addEventListener('click',e=>{ const modal=document.getElementById('velourLibraryModal'); if(modal&&e.target===modal)closeStoryLibrary(); });
})();`;

  try {
    const res = await fetch(SOURCE, { cache: 'no-store' });
    if (!res.ok) throw new Error('원본 로드 실패: HTTP ' + res.status);
    let html = await res.text();
    html = html.replace('</head>', FIX_CSS + '\n</head>');
    html = html.replace('</body>', LIBRARY_HTML + '\n<script>' + PATCH_JS + '<' + '/script>\n<script src="./velour-v3.5.js?v=3501"><' + '/script>\n<script src="./velour-v4.4.30.js?v=443001"><' + '/script>\n</body>');
    document.open(); document.write(html); document.close();
  } catch(err) {
    document.body.innerHTML='<div class="boot"><div><b>⚠️ VELOUR 로드 실패</b><span>'+String(err.message||err)+'<br><br>네트워크 연결 후 다시 열어줘.</span></div></div>';
  }
})();
</script>
